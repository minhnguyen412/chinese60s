<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 Learn Chinese the Fun Way! 🎬</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #ffffff;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { font-size: 28px; margin-bottom: 10px; color: #333; }
        .header p { color: #888; font-size: 14px; }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .video-section {
            background: #f8f8f8;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
        }
        .video-player iframe { width: 100%; height: 100%; border: 0; }

        .loading {
            text-align: center;
            padding: 30px 15px;
            color: #999;
            font-size: 12px;
        }

        .player-controls {
            padding: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: #f8f8f8;
            border-top: 2px solid #e0e0e0;
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            background: #faf14d;
            color: #333;
            border: 2px solid #e8d900;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
        }
        button:hover { background: #e8d900; }
        button.secondary { background: #e0e0e0; color: #666; border-color: #d0d0d0; }
        button.secondary:hover { background: #d0d0d0; }

        .time-display {
            padding: 8px 12px;
            background: #efefef;
            border-radius: 6px;
            font-size: 11px;
            color: #666;
            text-align: center;
            font-family: 'Courier New', monospace;
            min-width: 100px;
            margin-left: auto;
            border: 1px solid #ddd;
        }

        .subtitle-selector {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 15px;
            border-top: 2px solid #e0e0e0;
            flex-wrap: wrap;
            background: #f8f8f8;
        }
        .subtitle-selector .label { font-size: 12px; color: #333; margin-right: 4px; }
        .subtitle-selector label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            color: #333;
        }
        .subtitle-selector input[type="radio"] { cursor: pointer; width: 16px; height: 16px; }

        .transcript-section {
            background: #f8f8f8;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            height: 550px;
        }

        .transcript-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            position: relative;
            overscroll-behavior: contain;
        }

        .sentence {
            margin-bottom: 15px;
            padding: 10px;
            background: #ffffff;
            border-radius: 8px;
            border-left: 3px solid #ddd;
            cursor: pointer;
            transition: background-color 0.2s, border-color 0.2s;
        }
        .sentence:hover {
            background: #fffbf0;
            border-left-color: #faf14d;
        }
        .sentence.active {
            background: #fffef5;
            border-left-color: #b2fa4d;
        }

        .sentence-translation {
            font-size: 15px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .char {
            padding: 8px 10px;
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .char .pinyin { font-size: 11px; color: #999; line-height: 1; }
        .char .char-text { font-size: 18px; font-weight: 600; color: #333; }
        .char.passed { background: #f5f5f5; border-color: #d0d0d0; }
        .char.upcoming { opacity: 0.6; border-color: #e8e8e8; }
        .char.active { background: #fffef5; border-color: #faf14d; }
        .char.active .char-text { font-weight: 700; }

        .meta-info {
            font-size: 10px;
            color: #999;
            margin-top: 6px;
        }

        .transcript-area::-webkit-scrollbar { width: 6px; }
        .transcript-area::-webkit-scrollbar-track { background: #f0f0f0; }
        .transcript-area::-webkit-scrollbar-thumb { background: #d0d0d0; border-radius: 3px; }
        .transcript-area::-webkit-scrollbar-thumb:hover { background: #faf14d; }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.4);
        }
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: #ffffff;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            max-width: 420px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
        }
        .character-detail { text-align: center; }
        .character-detail h2 { font-size: 36px; margin-bottom: 6px; font-weight: 600; color: #333; }
        .character-detail-pinyin { font-size: 16px; color: #7bb800; font-style: italic; font-weight: 600; }
        .character-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
            text-align: left;
        }
        .character-detail-image {
            width: 100%;
            height: auto;
            max-height: 150px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid #e0e0e0;
        }
        .info-item {
            background: #f8f8f8;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e0e0e0;
        }
        .info-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .info-value { font-size: 13px; color: #333; line-height: 1.4; }
        .character-audio { margin-top: 8px; }
        .character-audio audio { width: 100%; height: 28px; }

        /* Visibility helpers: desktop vs mobile layout */
        .mob-only { display: none; }

        /* Mobile compact layout: đặt cuối thẻ <style> */
@media (max-width: 1024px) {
    html, body { height: 100%; }

    .container {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        padding: 0;
    }

    .header {
        padding: 8px 12px;
        margin: 0;
    }
    .header h1 { font-size: 18px; margin-bottom: 0; }
    .header p { display: none; }

    .main-grid {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        margin: 0;
        gap: 0;
    }

    .video-section {
        flex-shrink: 0;
    }

    .transcript-section {
        flex: 1;
        min-height: 0;
        height: auto;
    }

    .transcript-area {
        padding: 8px;
    }

    .sentence {
        padding: 6px 8px;
        margin-bottom: 8px;
    }

    /* Subtitle: một hàng nút nhỏ */
    .subtitle-selector.mob-only {
        flex-wrap: nowrap;
        justify-content: center;
        gap: 6px;
        padding: 6px 8px;
    }
    .subtitle-selector.mob-only .label { display: none; }
    .subtitle-selector.mob-only label {
        margin: 0;
        padding: 4px 8px;
        gap: 4px;
        font-size: 12px;
        background: #ffffff;
        border: 1px solid #ddd;
        border-radius: 14px;
        white-space: nowrap;
    }
    .subtitle-selector.mob-only label:has(input:checked) {
        background: #faf14d;
        border-color: #e8d900;
        font-weight: 600;
    }
    .subtitle-selector.mob-only input[type="radio"] {
        width: 12px;
        height: 12px;
    }

    /* Điều khiển: một hàng */
    .player-controls.mob-only {
        flex-wrap: nowrap;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        border-top: 2px solid #e0e0e0;
    }
    .player-controls.mob-only .button-group {
        flex-wrap: nowrap;
        gap: 4px;
    }
    .player-controls.mob-only button {
        padding: 4px 8px;
        font-size: 14px;
    }
    .player-controls.mob-only .time-display {
        min-width: auto;
        padding: 4px 8px;
        font-size: 11px;
    }
}

        .clip-picker {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            flex-wrap: wrap; margin: 0 0 18px; padding: 12px 14px;
            background: #f8f8f8; border: 1px solid #e0e0e0; border-radius: 10px;
        }
        .clip-picker label { font-size: 14px; font-weight: 600; }
        .clip-picker select {
            max-width: 100%; min-width: 220px; padding: 9px 34px 9px 12px;
            border: 1px solid #ccc; border-radius: 7px; background: #fff;
            color: #333; font-size: 14px;
        }
        #clipStatus { color: #777; font-size: 12px; }
        .stt-text { padding: 10px; margin-bottom: 10px; background: #fff;
            border: 1px solid #e5e5e5; border-radius: 8px; white-space: pre-wrap;
            font-size: 13px; line-height: 1.5; color: #555; }
        .stt-label { font-size: 10px; color: #999; text-transform: uppercase;
            letter-spacing: .5px; margin-bottom: 4px; }
        @media (max-width: 1024px) {
            .clip-picker { margin: 0; padding: 7px 10px; border-radius: 0; gap: 7px; }
            .clip-picker label { font-size: 12px; }
            .clip-picker select { flex: 1; min-width: 0; padding: 7px 8px; font-size: 13px; }
            #clipStatus { display: none; }
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🐼 Animated Conversations for Everyday Mandarin 💬🌱</h1>
            <p>Learn Basic Chinese Conversations | Animated and Easy!</p>
        </div>

        <div class="clip-picker">
            <label for="clipSelect">Choose a clip:</label>
            <select id="clipSelect" aria-label="Choose a clip">
                <option value="">Loading clips...</option>
            </select>
            <span id="clipStatus" role="status"></span>
        </div>

        <div class="main-grid">
            <!-- Video -->
            <div class="video-section">
                <div class="video-player" id="videoPlayer">
                    <video id="drive-video" playsinline preload="metadata" style="width:100%;height:100%;display:block;background:#000;"></video>
                </div>

                <!-- Desktop controls -->
                <div class="player-controls desk-only">
                    <div class="button-group">
                        <button class="play-btn" onclick="togglePlay()">▶️</button>
                        <button class="secondary" onclick="stopVideo()">⏹️</button>
                        <button class="secondary" onclick="rewindVideo()">⏮️</button>
                        <button class="secondary" onclick="forwardVideo()">⏭️</button>
                    </div>
                    <div class="time-display"><span class="time-text">0:00 / 0:00</span></div>
                </div>

                <!-- Desktop subtitle selector -->
                <div class="subtitle-selector desk-only">
                    <span class="label">Subtitles:</span>
                    <label><input type="radio" name="subtitle" value="none" onchange="setSubtitle('none')"><span>None</span></label>
                    <label><input type="radio" name="subtitle" value="english" onchange="setSubtitle('english')" checked><span>English</span></label>
                    <label><input type="radio" name="subtitle" value="vietnamese" onchange="setSubtitle('vietnamese')"><span>Vietnamese</span></label>
                    <label><input type="radio" name="subtitle" value="both" onchange="setSubtitle('both')"><span>Both</span></label>
                </div>
            </div>

            <!-- Transcript -->
            <div class="transcript-section">
                <div class="transcript-area" id="transcriptArea">
                    <div class="loading">⏳ Loading transcript...</div>
                </div>
            </div>
        </div>

        <!-- Mobile subtitle selector -->
        <div class="subtitle-selector mob-only">
            <span class="label">Subtitles:</span>
            <label><input type="radio" name="subtitle" value="none" onchange="setSubtitle('none')"><span>None</span></label>
            <label><input type="radio" name="subtitle" value="english" onchange="setSubtitle('english')" checked><span>English</span></label>
            <label><input type="radio" name="subtitle" value="vietnamese" onchange="setSubtitle('vietnamese')"><span>Vietnamese</span></label>
            <label><input type="radio" name="subtitle" value="both" onchange="setSubtitle('both')"><span>Both</span></label>
        </div>

        <!-- Mobile controls -->
        <div class="player-controls mob-only">
            <div class="button-group">
                <button class="play-btn" onclick="togglePlay()">▶️</button>
                <button class="secondary" onclick="stopVideo()">⏹️</button>
                <button class="secondary" onclick="rewindVideo()">⏮️</button>
                <button class="secondary" onclick="forwardVideo()">⏭️</button>
            </div>
            <div class="time-display"><span class="time-text">0:00 / 0:00</span></div>
        </div>
    </div>

    <!-- Character modal -->
    <div id="characterModal" class="modal">
        <div class="modal-content">
            <div class="character-detail" id="characterDetailContent"></div>
        </div>
    </div>

    <script>
        // All clips are managed in one file. Add/edit clips in data/clips.json.
        const DATA_FILES = {
            clips: 'data/clips.json',
            images: 'data/imagesData.json'
        };

        const $ = id => document.getElementById(id);
        const transcriptArea = $('transcriptArea');
        const videoPlayerEl = $('videoPlayer');

        const st = {
            player: null,
            playerReady: false,
            clips: [],
            currentClip: null,
            transcript: null,
            sentenceMap: new Map(),   // legacy fallback: id -> {english, vietnamese}
            imagesMap: new Map(),     // character -> info
            subtitleMode: 'english',
            sentenceEls: [],          // DOM cache: .sentence elements
            charEls: [],              // DOM cache: .char elements per sentence
            activeS: -1,
            activeC: -1,
            timer: null,
            timeText: ''
        };

        // ---------- Utilities ----------

        function escapeHtml(str) {
            return String(str ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function charText(ch) {
            return ch.chars || ch.char || '';
        }

        function extractDriveFileId(url) {
            const text = String(url || '').trim();
            const patterns = [
                /drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/,
                /drive\.google\.com\/open\?id=([a-zA-Z0-9_-]+)/,
                /[?&]id=([a-zA-Z0-9_-]+)/
            ];
            for (const pattern of patterns) {
                const match = text.match(pattern);
                if (match) return match[1];
            }
            // Also accept a raw Google Drive file ID.
            if (/^[a-zA-Z0-9_-]{10,}$/.test(text)) return text;
            return '';
        }

        async function fetchJson(path) {
            const res = await fetch(path);
            if (!res.ok) throw new Error(`HTTP ${res.status} for ${path}`);
            return res.json();
        }

        // ---------- HTML5 video ----------

        function initPlayer() {
            if (st.player) return st.player;
            const video = document.createElement('video');
            video.id = 'drive-video';
            video.playsInline = true;
            video.preload = 'metadata';
            video.controls = false;
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.display = 'block';
            video.style.background = '#000';
            videoPlayerEl.replaceChildren(video);
            st.player = video;

            video.addEventListener('loadedmetadata', () => {
                st.playerReady = true;
                updateTime(video.currentTime || 0);
                updateHighlight(video.currentTime || 0);
            });
            video.addEventListener('play', () => { setPlayIcon(true); startSync(); });
            video.addEventListener('pause', () => { setPlayIcon(false); stopSync(); tick(); });
            video.addEventListener('ended', () => { setPlayIcon(false); stopSync(); tick(); });
            video.addEventListener('timeupdate', tick);
            video.addEventListener('error', () => {
                $('clipStatus').textContent = 'Video không tải được. Kiểm tra quyền chia sẻ/link MP4.';
                st.playerReady = false;
            });
            return video;
        }

        function getVideoUrl(url) {
            const raw = String(url || '').trim();
            if (!raw) return '';
            // Google Drive share link -> attempted direct download/stream URL.
            const id = extractDriveFileId(raw);
            if (id) return `https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`;
            // Also accept direct MP4 URLs from a host that supports streaming.
            return raw;
        }

        function setPlayIcon(playing) {
            const icon = playing ? '⏸️' : '▶️';
            document.querySelectorAll('.play-btn').forEach(b => { b.textContent = icon; });
        }

        function startSync() {
            if (st.timer) return;
            st.timer = setInterval(tick, 100);
        }

        function stopSync() {
            if (st.timer) {
                clearInterval(st.timer);
                st.timer = null;
            }
        }

        function tick() {
            if (!st.playerReady || !st.player) return;
            try {
                const t = st.player.currentTime || 0;
                updateHighlight(t);
                updateTime(t);
            } catch (e) { /* video not ready */ }
        }

        function currentTimeSafe() {
            try {
                return st.playerReady && st.player ? (st.player.currentTime || 0) : 0;
            } catch (e) {
                return 0;
            }
        }

        // ---------- Controls ----------

        function togglePlay() {
            if (!st.playerReady || !st.player) return;
            if (st.player.paused) {
                st.player.play().catch(() => {
                    setPlayIcon(false);
                });
            } else {
                st.player.pause();
            }
        }

        function stopVideo() {
            if (!st.player) return;
            st.player.pause();
            try { st.player.currentTime = 0; } catch (e) {}
            stopSync();
            setPlayIcon(false);
            updateHighlight(0);
            updateTime(0);
        }

        function rewindVideo() {
            if (!st.playerReady || !st.player) return;
            st.player.currentTime = Math.max(0, st.player.currentTime - 10);
            updateHighlight(currentTimeSafe());
        }

        function forwardVideo() {
            if (!st.playerReady || !st.player) return;
            const dur = Number.isFinite(st.player.duration) ? st.player.duration : currentTimeSafe() + 10;
            st.player.currentTime = Math.min(dur, st.player.currentTime + 10);
            updateHighlight(currentTimeSafe());
        }

        function seekToSentence(index) {
            if (!st.transcript || !st.playerReady || !st.player) return;
            const s = st.transcript.sentences[index];
            if (!s) return;
            st.player.currentTime = s.startTime;
            st.player.play().catch(() => {});
            updateHighlight(s.startTime);
        }

        // ---------- Data loading / clip switching ----------

        async function loadData() {
            const select = $('clipSelect');
            try {
                const data = await fetchJson(DATA_FILES.clips);
                st.clips = Array.isArray(data) ? data : (data.clips || []);
                if (!st.clips.length) throw new Error('clips.json không có clips');
            } catch (err) {
                select.innerHTML = '<option value="">Không tải được clips.json</option>';
                transcriptArea.innerHTML = '<div class="loading">Không tải được data/clips.json. Kiểm tra đường dẫn và JSON.</div>';
                $('clipStatus').textContent = err.message || 'Load error';
                return;
            }

            try {
                const imgs = await fetchJson(DATA_FILES.images);
                if (Array.isArray(imgs)) st.imagesMap = new Map(imgs.map(i => [i.character, i]));
            } catch (_) { /* character images are optional */ }

            select.innerHTML = st.clips.map((clip, index) => {
                const no = clip.no ?? index + 1;
                const title = clip.title || clip.name || `Clip ${no}`;
                return `<option value="${escapeHtml(no)}">${escapeHtml(`Clip ${no} — ${title}`)}</option>`;
            }).join('');
            select.addEventListener('change', () => {
                const no = select.value;
                const clip = st.clips.find((item, index) => String(item.no ?? index + 1) === String(no));
                if (clip) loadClip(clip);
            });
            await loadClip(st.clips[0]);
        }

        async function loadClip(clip) {
            if (!clip) return;
            stopSync();
            st.currentClip = clip;
            st.transcript = { sentences: Array.isArray(clip.sentences) ? clip.sentences : [] };
            // Inline translations in each sentence take priority. Legacy separate
            // sentence-map files are no longer required.
            st.sentenceMap = new Map();
            const video = initPlayer();
            st.playerReady = false;
            if (video) {
                video.pause();
                video.removeAttribute('src');
                video.load();
                const videoUrl = getVideoUrl(clip.videoUrl || clip.video || '');
                if (videoUrl) {
                    video.src = videoUrl;
                    video.load();
                    $('clipStatus').textContent = '';
                } else {
                    $('clipStatus').textContent = 'Clip này chưa có videoUrl.';
                }
            }
            document.querySelectorAll('.time-text').forEach(el => { el.textContent = '0:00 / 0:00'; });
            st.timeText = '';
            setPlayIcon(false);
            transcriptArea.scrollTop = 0;
            const heading = document.querySelector('.header h1');
            if (heading) heading.textContent = clip.title || clip.name || `Clip ${clip.no ?? ''}`;
            renderTranscript();
            const select = $('clipSelect');
            const index = st.clips.indexOf(clip);
            select.value = String(clip.no ?? index + 1);
            if (clip.stt) {
                // Optional raw STT text appears above the timed sentence list.
                // It can be a string or an object with text/content.
                const sttText = typeof clip.stt === 'string' ? clip.stt : (clip.stt.text || clip.stt.content || '');
                if (sttText) {
                    const block = document.createElement('div');
                    block.className = 'stt-text';
                    block.innerHTML = `<div class="stt-label">STT</div><div>${escapeHtml(sttText)}</div>`;
                    transcriptArea.prepend(block);
                }
            }
        }

        // ---------- Rendering ----------

        function renderTranscript() {
            const sentences = st.transcript?.sentences || [];
            if (!sentences.length) {
                transcriptArea.innerHTML = '<div class="loading">No data</div>';
                return;
            }

            const mode = st.subtitleMode;
            const html = sentences.map((s, idx) => {
                const tr = st.sentenceMap.get(s.id) || s;
                const lines = [];
                if (mode === 'vietnamese' && (tr.vietnamese || tr.vi)) lines.push(tr.vietnamese || tr.vi);
                else if (mode === 'english' && (tr.english || tr.en)) lines.push(tr.english || tr.en);
                else if (mode === 'both') {
                    if (tr.vietnamese || tr.vi) lines.push(tr.vietnamese || tr.vi);
                    if (tr.english || tr.en) lines.push(tr.english || tr.en);
                }
                const trHtml = lines
                    .map(t => `<div class="sentence-translation">${escapeHtml(t)}</div>`)
                    .join('');

                const chars = Array.isArray(s.characters) ? s.characters : [];
                const charsHtml = chars.length ? chars.map(ch => {
                    const t = charText(ch);
                    return `<span class="char" data-char="${escapeHtml(t)}">` +
                           `<span class="pinyin">${escapeHtml(ch.pinyin || '')}</span>` +
                           `<span class="char-text">${escapeHtml(t)}</span></span>`;
                }).join('') : `<span class="char-text" style="padding:8px 2px">${escapeHtml(s.text || '')}</span>`;

                return `
                    <div class="sentence" data-index="${idx}">
                        ${trHtml}
                        <div class="character-line">${charsHtml}</div>
                        <div class="meta-info">${formatTime(s.startTime || 0)} - ${formatTime(s.endTime || 0)} (${Number(s.duration || ((s.endTime || 0) - (s.startTime || 0))).toFixed(1)}s)</div>
                    </div>`;
            }).join('');

            transcriptArea.innerHTML = html;

            // Cache DOM references once, instead of querying on every tick
            st.sentenceEls = Array.from(transcriptArea.querySelectorAll('.sentence'));
            st.charEls = st.sentenceEls.map(el => Array.from(el.querySelectorAll('.char')));
            st.activeS = -1;
            st.activeC = -1;

            updateHighlight(currentTimeSafe());
        }

        function setSubtitle(mode) {
            st.subtitleMode = mode;
            document.querySelectorAll('input[name="subtitle"]').forEach(r => {
                r.checked = r.value === mode;
            });
            renderTranscript();
        }

        // ---------- Highlighting ----------

        // Only touches the DOM when a class actually needs to change
        function setCharState(el, state) {
            if (el._state === state) return;
            if (el._state) el.classList.remove(el._state);
            if (state) el.classList.add(state);
            el._state = state;
        }

        function findPosition(t) {
            const sents = st.transcript?.sentences || [];
            for (let i = 0; i < sents.length; i++) {
                const s = sents[i];
                if (t >= s.startTime && t <= s.endTime) {
                    const chars = s.characters || [];
                    let c = -1;
                    for (let j = 0; j < chars.length; j++) {
                        const ch = chars[j];
                        if (t >= ch.startTime && t <= ch.startTime + ch.duration) {
                            c = j;
                            break;
                        }
                    }
                    return { s: i, c };
                }
            }
            return { s: -1, c: -1 };
        }

        function updateHighlight(t) {
            if (!st.transcript) return;

            const { s, c } = findPosition(t);
            if (s === st.activeS && c === st.activeC) return;

            if (s !== st.activeS) {
                if (st.activeS >= 0 && st.sentenceEls[st.activeS]) {
                    st.sentenceEls[st.activeS].classList.remove('active');
                }
                if (s >= 0 && st.sentenceEls[s]) {
                    st.sentenceEls[s].classList.add('active');
                    scrollToSentence(st.sentenceEls[s]);
                }
                // Sentences before the current one are "passed", the current one is "upcoming" by default,
                // later sentences are unstyled. Runs only on sentence change.
                st.charEls.forEach((list, i) => {
                    const base = i < s ? 'passed' : (i === s ? 'upcoming' : '');
                    list.forEach(el => setCharState(el, base));
                });
            }

            if (s >= 0 && st.charEls[s]) {
                st.charEls[s].forEach((el, j) => {
                    setCharState(el, j === c ? 'active' : (j < c ? 'passed' : 'upcoming'));
                });
            }

            st.activeS = s;
            st.activeC = c;
        }

        // Scroll only the transcript box, never the whole page
        function scrollToSentence(el) {
            const target = el.offsetTop - transcriptArea.clientHeight / 2 + el.offsetHeight / 2;
            transcriptArea.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
        }

        function updateTime(t) {
            const sents = st.transcript?.sentences;
            if (!sents || !sents.length) return;
            const mediaDuration = st.player && Number.isFinite(st.player.duration) ? st.player.duration : NaN;
            const dur = Number.isFinite(mediaDuration) && mediaDuration > 0
                ? mediaDuration
                : sents[sents.length - 1].endTime;
            const text = `${formatTime(t)} / ${formatTime(dur)}`;
            if (text === st.timeText) return;
            st.timeText = text;
            document.querySelectorAll('.time-text').forEach(el => { el.textContent = text; });
        }

        // ---------- Character modal ----------

        function showCharacter(ch) {
            const info = st.imagesMap.get(ch);
            const body = $('characterDetailContent');

            if (!info) {
                body.innerHTML = `
                    <h2>${escapeHtml(ch)}</h2>
                    <p class="info-value">Character info not found</p>`;
            } else {
                body.innerHTML = `
                    <div class="character-detail-header">
                        <h2>${escapeHtml(info.character)}</h2>
                        <div class="character-detail-pinyin">${escapeHtml(info.pinyin)}</div>
                    </div>
                    <div class="character-detail-body">
                        <div>
                            ${info.imageSrc ? `<img src="${escapeHtml(info.imageSrc)}" alt="${escapeHtml(info.character)}" class="character-detail-image">` : ''}
                        </div>
                        <div>
                            <div class="info-item">
                                <div class="info-label">Meaning</div>
                                <div class="info-value">${escapeHtml(info.meaning || 'N/A')}</div>
                            </div>
                            ${info.audioSrc ? `
                                <div class="character-audio">
                                    <audio controls preload="none" src="${escapeHtml(info.audioSrc)}"></audio>
                                </div>` : ''}
                        </div>
                    </div>`;
            }

            $('characterModal').classList.add('show');
        }

        function closeCharacterModal() {
            $('characterModal').classList.remove('show');
            // Stop any audio that is still playing
            document.querySelectorAll('#characterDetailContent audio').forEach(a => a.pause());
        }

        // ---------- Event wiring ----------

        // One delegated listener instead of one inline handler per character
        transcriptArea.addEventListener('click', e => {
            const charEl = e.target.closest('.char');
            if (charEl) {
                showCharacter(charEl.dataset.char);
                return;
            }
            const sentenceEl = e.target.closest('.sentence');
            if (sentenceEl) seekToSentence(Number(sentenceEl.dataset.index));
        });

        $('characterModal').addEventListener('click', e => {
            if (e.target === e.currentTarget) closeCharacterModal();
        });

        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeCharacterModal();
        });

        window.addEventListener('load', initPlayer);

        loadData();
    </script>
</body>
</html>
