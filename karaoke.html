<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Player - YouTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .video-player {
            width: 100%;
            height: 400px;
            background: #000;
        }

        .player-controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #333;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover {
            background: #555;
        }

        .transcript-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .transcript-header {
            padding: 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
        }

        .transcript-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .sentence {
            margin-bottom: 20px;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
            border-left: 3px solid #555;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence:hover {
            background: #2a2a2a;
            border-left-color: #667eea;
        }

        .sentence.active {
            background: #2a3a5a;
            border-left-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .sentence-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .char {
            padding: 6px 8px;
            background: #333;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .char .pinyin {
            font-size: 10px;
            color: #aaa;
            line-height: 1;
        }

        .char .char-text {
            font-size: 14px;
        }

        .char.active {
            background: #667eea;
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
            font-weight: 600;
        }

        .char.upcoming {
            background: #3a3a3a;
            opacity: 0.6;
        }

        .char.passed {
            background: #444;
            opacity: 0.8;
        }

        .meta-info {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        .transcript-area::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-area::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .transcript-area::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .info-box {
            background: #2a3a5a;
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .time-display {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            text-align: center;
            font-family: 'Courier New', monospace;
            min-width: 120px;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            animation: slideUp 0.3s;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            cursor: pointer;
            color: #aaa;
        }

        .modal-close:hover {
            color: #fff;
        }

        .character-detail {
            text-align: center;
        }

        .character-detail-image {
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            border-radius: 8px;
            object-fit: cover;
        }

        .character-detail h2 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .character-detail-pinyin {
            font-size: 18px;
            color: #667eea;
            margin-bottom: 15px;
            font-style: italic;
        }

        .character-detail-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .info-item {
            background: #2a2a2a;
            padding: 12px;
            border-radius: 8px;
        }

        .info-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 14px;
            color: #fff;
        }

        .character-audio {
            margin-top: 20px;
        }

        .character-audio audio {
            width: 100%;
            margin-top: 10px;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .video-player {
                height: 300px;
            }

            .transcript-section {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Karaoke Player - YouTube</h1>
            <p>YouTube video + Perfect karaoke sync (Increases view count)</p>
        </div>

        <div class="main-grid">
            <!-- Video Player Section -->
            <div class="video-section">
                <div class="video-player" id="videoPlayer">
                    <div class="loading">📺 Đang tải video YouTube...</div>
                </div>



                <!-- Controls -->
                <div class="player-controls">
                    <div class="button-group">
                        <button onclick="togglePlayPause()" id="playBtn">▶️ Play</button>
                        <button onclick="stopVideo()" class="secondary">⏹️ Stop</button>
                        <button onclick="rewindVideo()" class="secondary">⏮️ -10s</button>
                        <button onclick="forwardVideo()" class="secondary">⏭️ +10s</button>
                    </div>
                    <div class="time-display">
                        <div id="timeDisplay">0:00 / 0:00</div>
                    </div>
                </div>

                <!-- Status -->
                <div style="padding: 15px; background: #1a1a1a; border-top: 1px solid #333;">
                    <div class="info-box" id="statusBox">
                        ⏳ Đang tải video và transcript...
                    </div>
                </div>
            </div>

            <!-- Transcript Section -->
            <div class="transcript-section">
                <div class="transcript-header">
                    📝 Karaoke Transcript
                </div>
                <div class="transcript-area" id="transcriptArea">
                    <div class="loading">⏳ Đang tải transcript...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Character Detail Modal -->
    <div id="characterModal" class="modal">
        <div style="position: relative; width: 100%;">
            <span class="modal-close" onclick="closeCharacterModal()">&times;</span>
            <div class="modal-content">
                <div class="character-detail" id="characterDetailContent">
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let transcriptData = null;
        let sentencesData = null;
        let imagesData = null;
        let currentSentenceIndex = -1;
        let currentCharIndex = -1;
        let updateInterval = null;
        let videoStartTime = 0;
        let videoPausedTime = 0;
        let currentLanguage = 'english'; // 'english' or 'vietnamese'

        const statusBox = document.getElementById('statusBox');
        const transcriptArea = document.getElementById('transcriptArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');
        const videoPlayer = document.getElementById('videoPlayer');

        // YouTube API ready
        function onYouTubeIframeAPIReady() {
            console.log('YouTube API ready');
        }

        function extractYoutubeId(url) {
            let videoId = '';
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];

            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    videoId = match[1];
                    break;
                }
            }

            return videoId;
        }

        function loadYoutubeVideoAuto(url) {
            const videoId = extractYoutubeId(url);

            if (!videoId) {
                statusBox.innerHTML = '❌ Invalid YouTube link';
                return;
            }

            // Create iframe with enablejsapi
            videoPlayer.innerHTML = `
                <div id="yt-player"></div>
            `;

            // Initialize player after short delay
            setTimeout(() => {
                player = new YT.Player('yt-player', {
                    height: '400',
                    width: '100%',
                    videoId: videoId,
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }, 100);
        }

        function onPlayerReady(event) {
            console.log('Player ready');
            statusBox.innerHTML = '✅ Player ready! Transcript loading...';
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                videoStartTime = player.getCurrentTime();
                playBtn.textContent = '⏸️ Pause';
                startSync();
            } else if (event.data === YT.PlayerState.PAUSED) {
                videoPausedTime = player.getCurrentTime();
                playBtn.textContent = '▶️ Play';
                stopSync();
            } else if (event.data === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶️ Play';
                stopSync();
            }
        }

        function loadJsonFromPath(filePath) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    transcriptData = data;
                    
                    // Validate
                    if (!transcriptData.sentences || transcriptData.sentences.length === 0) {
                        statusBox.innerHTML = '❌ JSON must have sentences array';
                        return;
                    }
                    
                    const firstChar = transcriptData.sentences[0].characters?.[0];
                    if (!firstChar || (!firstChar.chars && !firstChar.char)) {
                        statusBox.innerHTML = '❌ Characters must have "chars" field';
                        return;
                    }

                    loadSentencesData();
                    loadImagesData();
                })
                .catch(error => {
                    statusBox.innerHTML = '❌ Error loading JSON: ' + error.message;
                    console.error('JSON fetch error:', error);
                });
        }

        function loadSentencesData() {
            fetch('data/boya-sentences.json')
                .then(response => response.json())
                .then(data => {
                    sentencesData = data;
                    console.log('Sentences data loaded:', sentencesData.length);
                })
                .catch(error => {
                    console.error('Error loading sentences:', error);
                });
        }

        function loadImagesData() {
            fetch('data/imagesData.json')
                .then(response => response.json())
                .then(data => {
                    imagesData = data;
                    console.log('Images data loaded:', imagesData.length);
                    
                    // Render after all data loaded
                    renderTranscript();
                    statusBox.innerHTML = `✅ Loaded ${transcriptData.sentences.length} sentences! Ready to play.`;
                })
                .catch(error => {
                    console.error('Error loading images:', error);
                    // Still render even if images fail
                    renderTranscript();
                    statusBox.innerHTML = `✅ Loaded ${transcriptData.sentences.length} sentences! (Images may not load)`;
                });
        }

        function getCharacterInfo(charText) {
            if (!imagesData) return null;
            return imagesData.find(img => img.character === charText);
        }

        function getSentenceTranslation(sentenceId) {
            if (!sentencesData) return { english: '', vietnamese: '' };
            const sentence = sentencesData.find(s => s.id === sentenceId);
            return sentence ? { english: sentence.english, vietnamese: sentence.vietnamese } : { english: '', vietnamese: '' };
        }

        function renderTranscript() {
            if (!transcriptData || transcriptData.sentences.length === 0) {
                transcriptArea.innerHTML = '<div class="loading">No data</div>';
                return;
            }

            let html = '';
            transcriptData.sentences.forEach((sentence, idx) => {
                const translation = getSentenceTranslation(sentence.id);
                const displayText = currentLanguage === 'vietnamese' ? translation.vietnamese : translation.english;

                const charGroupsHtml = sentence.characters
                    .map((char, charIdx) => {
                        const charText = char.chars || char.char;
                        const charInfo = getCharacterInfo(charText);
                        const pinyin = charInfo ? charInfo.pinyin : '';
                        
                        return `
                            <span class="char" data-sentence="${idx}" data-char="${charIdx}" onclick="showCharacterDetail('${charText}', event)">
                                <span class="pinyin">${pinyin}</span>
                                <span class="char-text">${charText}</span>
                            </span>
                        `;
                    })
                    .join('');

                html += `
                    <div class="sentence" data-index="${idx}" onclick="seekToSentence(${idx})">
                        <div class="sentence-text">${displayText || sentence.text}</div>
                        <div class="character-line">${charGroupsHtml}</div>
                        <div class="meta-info">
                            ${formatTime(sentence.startTime)} - ${formatTime(sentence.endTime)} 
                            (${sentence.duration.toFixed(1)}s)
                        </div>
                    </div>
                `;
            });
            transcriptArea.innerHTML = html;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startSync() {
            if (updateInterval) clearInterval(updateInterval);

            updateInterval = setInterval(() => {
                if (!player || !transcriptData) return;

                try {
                    const state = player.getPlayerState();
                    if (state !== YT.PlayerState.PLAYING) return;

                    const currentTime = player.getCurrentTime();
                    updateTranscriptHighlight(currentTime);
                    updateTimeDisplay(currentTime);
                } catch (e) {
                    console.error('Sync error:', e);
                }
            }, 50);
        }

        function stopSync() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        function updateTranscriptHighlight(currentTime) {
            if (!transcriptData) return;

            let newSentenceIndex = -1;
            let newCharIndex = -1;

            for (let i = 0; i < transcriptData.sentences.length; i++) {
                const sentence = transcriptData.sentences[i];
                if (currentTime >= sentence.startTime && currentTime <= sentence.endTime) {
                    newSentenceIndex = i;

                    for (let j = 0; j < sentence.characters.length; j++) {
                        const char = sentence.characters[j];
                        const charEndTime = char.startTime + char.duration;
                        if (currentTime >= char.startTime && currentTime <= charEndTime) {
                            newCharIndex = j;
                            break;
                        }
                    }
                    break;
                }
            }

            if (newSentenceIndex !== currentSentenceIndex) {
                document.querySelectorAll('.sentence.active').forEach(el => {
                    el.classList.remove('active');
                });

                if (newSentenceIndex >= 0) {
                    const sentenceEl = document.querySelector(`[data-index="${newSentenceIndex}"]`);
                    if (sentenceEl) {
                        sentenceEl.classList.add('active');
                        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }

                currentSentenceIndex = newSentenceIndex;
            }

            document.querySelectorAll('.char').forEach(el => {
                const sentenceIdx = parseInt(el.dataset.sentence);
                const charIdx = parseInt(el.dataset.char);

                el.classList.remove('active', 'passed', 'upcoming');

                if (sentenceIdx === newSentenceIndex) {
                    if (charIdx === newCharIndex) {
                        el.classList.add('active');
                    } else if (charIdx < newCharIndex) {
                        el.classList.add('passed');
                    } else {
                        el.classList.add('upcoming');
                    }
                } else if (sentenceIdx < newSentenceIndex) {
                    el.classList.add('passed');
                }
            });

            currentCharIndex = newCharIndex;
        }

        function updateTimeDisplay(currentTime = null) {
            let time = currentTime || 0;
            if (!currentTime && player) {
                try {
                    time = player.getCurrentTime();
                } catch (e) {
                    time = 0;
                }
            }

            let duration = 0;
            if (transcriptData && transcriptData.sentences.length > 0) {
                const lastSentence = transcriptData.sentences[transcriptData.sentences.length - 1];
                duration = lastSentence.endTime;
            }
            timeDisplay.textContent = `${formatTime(time)} / ${formatTime(duration)}`;
        }

        function togglePlayPause() {
            if (!player) {
                statusBox.innerHTML = '❌ Load video first!';
                return;
            }

            try {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            } catch (e) {
                statusBox.innerHTML = '❌ Error: ' + e.message;
            }
        }

        function stopVideo() {
            if (!player) return;
            try {
                player.stopVideo();
                updateTranscriptHighlight(0);
                updateTimeDisplay(0);
                playBtn.textContent = '▶️ Play';
            } catch (e) {
                console.error('Stop error:', e);
            }
        }

        function rewindVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                player.seekTo(Math.max(0, current - 10));
            } catch (e) {
                console.error('Rewind error:', e);
            }
        }

        function forwardVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                player.seekTo(Math.min(duration, current + 10));
            } catch (e) {
                console.error('Forward error:', e);
            }
        }

        function seekToSentence(index) {
            if (!transcriptData || !player) return;
            try {
                const sentence = transcriptData.sentences[index];
                player.seekTo(sentence.startTime);
                player.playVideo();
            } catch (e) {
                console.error('Seek error:', e);
            }
        }

        function showCharacterDetail(charText, event) {
            event.stopPropagation();
            const charInfo = getCharacterInfo(charText);
            if (!charInfo) {
                alert('Character info not found');
                return;
            }

            let html = `
                <h2>${charInfo.character}</h2>
                <div class="character-detail-pinyin">${charInfo.pinyin}</div>
            `;

            if (charInfo.imageSrc) {
                html += `<img src="${charInfo.imageSrc}" alt="${charInfo.character}" class="character-detail-image">`;
            }

            html += `
                <div class="character-detail-info">
                    <div class="info-item">
                        <div class="info-label">Meaning</div>
                        <div class="info-value">${charInfo.meaning}</div>
                    </div>
                </div>
            `;

            if (charInfo.audioSrc) {
                html += `
                    <div class="character-audio">
                        <audio controls>
                            <source src="${charInfo.audioSrc}" type="audio/mpeg">
                            Your browser does not support the audio element.
                        </audio>
                    </div>
                `;
            }

            document.getElementById('characterDetailContent').innerHTML = html;
            document.getElementById('characterModal').classList.add('show');
        }

        function closeCharacterModal() {
            document.getElementById('characterModal').classList.remove('show');
        }

        window.addEventListener('click', (event) => {
            const modal = document.getElementById('characterModal');
            if (event.target === modal) {
                closeCharacterModal();
            }
        });

        window.addEventListener('load', () => {
            // Auto-load YouTube video
            loadYoutubeVideoAuto('https://www.youtube.com/watch?v=yRhp-kQfD5g');
            // Auto-load JSON transcript
            loadJsonFromPath('data/boya-transcript.json');
        });
    </script>
</body>
</html>
