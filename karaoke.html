<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Player - YouTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
        }

        .video-player {
            width: 100%;
            height: 400px;
            background: #000;
        }

        .player-controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover {
            background: #555;
        }

        .transcript-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .transcript-header {
            padding: 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .language-toggle {
            display: flex;
            gap: 8px;
        }

        .language-toggle button {
            padding: 6px 12px;
            font-size: 12px;
        }

        .language-toggle button.active {
            background: #667eea;
        }

        .transcript-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .sentence {
            margin-bottom: 20px;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
            border-left: 3px solid #555;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence:hover {
            background: #2a2a2a;
            border-left-color: #667eea;
        }

        .sentence.active {
            background: #2a3a5a;
            border-left-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .sentence-id {
            font-size: 12px;
            color: #888;
            margin-bottom: 6px;
        }

        .sentence-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 8px;
        }

        .char-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .char-pinyin {
            font-size: 10px;
            color: #999;
            height: 14px;
            text-align: center;
            min-width: 30px;
        }

        .char {
            padding: 8px 10px;
            background: #333;
            border-radius: 4px;
            font-size: 16px;
            transition: all 0.1s;
            cursor: pointer;
            min-width: 40px;
            text-align: center;
            border: none;
        }

        .char.active {
            background: #667eea;
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
            font-weight: 600;
        }

        .char.upcoming {
            background: #3a3a3a;
            opacity: 0.6;
        }

        .char.passed {
            background: #444;
            opacity: 0.8;
        }

        .meta-info {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        .transcript-area::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-area::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .transcript-area::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .info-box {
            background: #2a3a5a;
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .time-display {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            text-align: center;
            font-family: 'Courier New', monospace;
            min-width: 120px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            border: 1px solid #333;
            animation: slideUp 0.3s;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            color: #aaa;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: #fff;
        }

        .char-image {
            width: 120px;
            height: 120px;
            margin: 0 auto;
            border-radius: 8px;
            object-fit: contain;
            background: #2a2a2a;
            padding: 10px;
        }

        .char-info {
            text-align: center;
        }

        .char-info-title {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .char-info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #333;
            font-size: 14px;
        }

        .char-info-row label {
            color: #888;
        }

        .char-info-row span {
            color: #fff;
            font-weight: 500;
        }

        .audio-btn {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            width: 100%;
        }

        .audio-btn:hover {
            background: #5568d3;
        }

        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .video-player {
                height: 300px;
            }

            .transcript-section {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Karaoke Player - YouTube</h1>
            <p>YouTube video + Perfect karaoke sync</p>
        </div>

        <div class="main-grid">
            <!-- Video Player Section -->
            <div class="video-section">
                <div class="video-player" id="videoPlayer">
                    <div class="loading">📺 YouTube video will appear here</div>
                </div>

                <!-- Controls -->
                <div class="player-controls">
                    <div class="button-group">
                        <button onclick="togglePlayPause()" id="playBtn">▶️ Play</button>
                        <button onclick="stopVideo()" class="secondary">⏹️ Stop</button>
                        <button onclick="rewindVideo()" class="secondary">⏮️ -10s</button>
                        <button onclick="forwardVideo()" class="secondary">⏭️ +10s</button>
                    </div>
                    <div class="time-display">
                        <div id="timeDisplay">0:00 / 0:00</div>
                    </div>
                </div>

                <!-- Status -->
                <div style="padding: 15px; background: #1a1a1a; border-top: 1px solid #333;">
                    <div class="info-box" id="statusBox">
                        ℹ️ Đang tải video và dữ liệu...
                    </div>
                </div>
            </div>

            <!-- Transcript Section -->
            <div class="transcript-section">
                <div class="transcript-header">
                    <div>📝 Karaoke Transcript</div>
                    <div class="language-toggle">
                        <button class="lang-btn active" onclick="setLanguage('english')">English</button>
                        <button class="lang-btn" onclick="setLanguage('vietnamese')">Vietnamese</button>
                    </div>
                </div>
                <div class="transcript-area" id="transcriptArea">
                    <div class="loading">Đang tải dữ liệu...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Character Detail Modal -->
    <div class="modal" id="charModal">
        <div class="modal-content">
            <div class="modal-header">
                <div></div>
                <button class="close-btn" onclick="closeCharModal()">×</button>
            </div>
            <img id="charImage" class="char-image" src="" alt="Character">
            <div class="char-info">
                <div class="char-info-title" id="charTitle"></div>
                <div class="char-info-row">
                    <label>Pinyin:</label>
                    <span id="charPinyin"></span>
                </div>
                <div class="char-info-row">
                    <label>Meaning:</label>
                    <span id="charMeaning"></span>
                </div>
                <button class="audio-btn" id="audioBtn" onclick="playCharAudio()">🔊 Play Audio</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let transcriptData = null;
        let sentencesData = null;
        let imagesData = null;
        let currentSentenceIndex = -1;
        let currentCharIndex = -1;
        let updateInterval = null;
        let currentLanguage = 'english';
        let currentCharAudio = null;

        const statusBox = document.getElementById('statusBox');
        const transcriptArea = document.getElementById('transcriptArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');
        const videoPlayer = document.getElementById('videoPlayer');
        const charModal = document.getElementById('charModal');

        // Auto-load on page load
        window.addEventListener('load', async () => {
            await loadAllData();
            loadYoutubeVideo('yRhp-kQfD5g'); // Default video ID
        });

        // Close modal when clicking outside
        charModal.addEventListener('click', (e) => {
            if (e.target === charModal) {
                closeCharModal();
            }
        });

        async function loadAllData() {
            try {
                // Load transcript data
                const transcriptRes = await fetch('data/boya-transcript.json');
                transcriptData = await transcriptRes.json();

                // Load sentences data
                const sentencesRes = await fetch('data/boya-sentences.json');
                sentencesData = await sentencesRes.json();

                // Load images/characters data
                const imagesRes = await fetch('data/imagesData.json');
                imagesData = await imagesRes.json();

                statusBox.innerHTML = '✅ Tất cả dữ liệu đã sẵn sàng! Nhấn Play để bắt đầu.';
                renderTranscript();
            } catch (error) {
                statusBox.innerHTML = '❌ Lỗi tải dữ liệu: ' + error.message;
                console.error('Load error:', error);
            }
        }

        function extractYoutubeId(url) {
            if (!url) return '';
            
            let videoId = '';
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];

            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    videoId = match[1];
                    break;
                }
            }

            return videoId;
        }

        function loadYoutubeVideo(videoId) {
            if (!videoId) {
                statusBox.innerHTML = '❌ Invalid YouTube link';
                return;
            }

            videoPlayer.innerHTML = `<div id="yt-player"></div>`;

            setTimeout(() => {
                player = new YT.Player('yt-player', {
                    height: '400',
                    width: '100%',
                    videoId: videoId,
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }, 100);
        }

        function onPlayerReady(event) {
            console.log('Player ready');
            statusBox.innerHTML = '✅ Sẵn sàng! Nhấn Play để bắt đầu.';
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                playBtn.textContent = '⏸️ Pause';
                startSync();
            } else if (event.data === YT.PlayerState.PAUSED) {
                playBtn.textContent = '▶️ Play';
                stopSync();
            } else if (event.data === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶️ Play';
                stopSync();
            }
        }

        function renderTranscript() {
            if (!transcriptData || transcriptData.length === 0) {
                transcriptArea.innerHTML = '<div class="loading">No data</div>';
                return;
            }

            let html = '';
            transcriptData.forEach((item, idx) => {
                const sentenceInfo = sentencesData.find(s => s.id === item.id);
                const text = currentLanguage === 'vietnamese' 
                    ? sentenceInfo?.vietnamese 
                    : sentenceInfo?.english;

                const charGroupsHtml = item.characters
                    .map((char, charIdx) => {
                        const charData = imagesData.find(img => img.character === char);
                        const pinyin = charData ? charData.pinyin : '';
                        
                        return `
                            <div class="char-container">
                                <div class="char-pinyin">${pinyin}</div>
                                <button class="char" data-sentence="${idx}" data-char="${charIdx}" data-char-text="${char}" onclick="showCharModal('${char}', event)">
                                    ${char}
                                </button>
                            </div>
                        `;
                    })
                    .join('');

                html += `
                    <div class="sentence" data-index="${idx}" onclick="seekToSentence(${idx})">
                        <div class="sentence-id">ID: ${item.id}</div>
                        <div class="sentence-text">${text || 'N/A'}</div>
                        <div class="character-line">${charGroupsHtml}</div>
                        <div class="meta-info">
                            ${formatTime(item.startTime)} - ${formatTime(item.endTime)} 
                            (${item.duration.toFixed(1)}s)
                        </div>
                    </div>
                `;
            });
            transcriptArea.innerHTML = html;
        }

        function setLanguage(lang) {
            currentLanguage = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            renderTranscript();
        }

        function showCharModal(char, event) {
            event.stopPropagation();
            
            const charData = imagesData.find(img => img.character === char);
            if (!charData) return;

            document.getElementById('charImage').src = charData.imageSrc;
            document.getElementById('charTitle').textContent = charData.character;
            document.getElementById('charPinyin').textContent = charData.pinyin;
            document.getElementById('charMeaning').textContent = charData.meaning;
            currentCharAudio = charData.audioSrc;

            charModal.classList.add('show');
        }

        function closeCharModal() {
            charModal.classList.remove('show');
        }

        function playCharAudio() {
            if (currentCharAudio) {
                const audio = new Audio(currentCharAudio);
                audio.play();
            }
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startSync() {
            if (updateInterval) clearInterval(updateInterval);

            updateInterval = setInterval(() => {
                if (!player || !transcriptData) return;

                try {
                    const state = player.getPlayerState();
                    if (state !== YT.PlayerState.PLAYING) return;

                    const currentTime = player.getCurrentTime();
                    updateTranscriptHighlight(currentTime);
                    updateTimeDisplay(currentTime);
                } catch (e) {
                    console.error('Sync error:', e);
                }
            }, 50);
        }

        function stopSync() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        function updateTranscriptHighlight(currentTime) {
            if (!transcriptData) return;

            let newSentenceIndex = -1;
            let newCharIndex = -1;

            for (let i = 0; i < transcriptData.length; i++) {
                const sentence = transcriptData[i];
                if (currentTime >= sentence.startTime && currentTime <= sentence.endTime) {
                    newSentenceIndex = i;

                    for (let j = 0; j < sentence.characters.length; j++) {
                        const char = sentence.characters[j];
                        const charEndTime = char.startTime + char.duration;
                        if (currentTime >= char.startTime && currentTime <= charEndTime) {
                            newCharIndex = j;
                            break;
                        }
                    }
                    break;
                }
            }

            if (newSentenceIndex !== currentSentenceIndex) {
                document.querySelectorAll('.sentence.active').forEach(el => {
                    el.classList.remove('active');
                });

                if (newSentenceIndex >= 0) {
                    const sentenceEl = document.querySelector(`[data-index="${newSentenceIndex}"]`);
                    if (sentenceEl) {
                        sentenceEl.classList.add('active');
                        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }

                currentSentenceIndex = newSentenceIndex;
            }

            document.querySelectorAll('.char').forEach(el => {
                const sentenceIdx = parseInt(el.dataset.sentence);
                const charIdx = parseInt(el.dataset.char);

                el.classList.remove('active', 'passed', 'upcoming');

                if (sentenceIdx === newSentenceIndex) {
                    if (charIdx === newCharIndex) {
                        el.classList.add('active');
                    } else if (charIdx < newCharIndex) {
                        el.classList.add('passed');
                    } else {
                        el.classList.add('upcoming');
                    }
                } else if (sentenceIdx < newSentenceIndex) {
                    el.classList.add('passed');
                }
            });

            currentCharIndex = newCharIndex;
        }

        function updateTimeDisplay(currentTime = null) {
            let time = currentTime || 0;
            if (!currentTime && player) {
                try {
                    time = player.getCurrentTime();
                } catch (e) {
                    time = 0;
                }
            }

            let duration = 0;
            if (transcriptData && transcriptData.length > 0) {
                const lastSentence = transcriptData[transcriptData.length - 1];
                duration = lastSentence.endTime;
            }
            timeDisplay.textContent = `${formatTime(time)} / ${formatTime(duration)}`;
        }

        function togglePlayPause() {
            if (!player) {
                statusBox.innerHTML = '❌ Vui lòng tải video trước!';
                return;
            }

            try {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            } catch (e) {
                statusBox.innerHTML = '❌ Lỗi: ' + e.message;
            }
        }

        function stopVideo() {
            if (!player) return;
            try {
                player.stopVideo();
                updateTranscriptHighlight(0);
                updateTimeDisplay(0);
                playBtn.textContent = '▶️ Play';
            } catch (e) {
                console.error('Stop error:', e);
            }
        }

        function rewindVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                player.seekTo(Math.max(0, current - 10));
            } catch (e) {
                console.error('Rewind error:', e);
            }
        }

        function forwardVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                player.seekTo(Math.min(duration, current + 10));
            } catch (e) {
                console.error('Forward error:', e);
            }
        }

        function seekToSentence(index) {
            if (!transcriptData || !player) return;
            try {
                const sentence = transcriptData[index];
                player.seekTo(sentence.startTime);
                player.playVideo();
            } catch (e) {
                console.error('Seek error:', e);
            }
        }

        function onYouTubeIframeAPIReady() {
            console.log('YouTube API ready');
        }
    </script>
</body>
</html>
