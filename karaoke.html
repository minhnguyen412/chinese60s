<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Player - Learn Chinese</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #222;
            --green: #7cb83e;
            --green-dark: #5a8f27;
            --green-light: #d8f0a0;
            --green-pale: #f2fde0;
            --yellow: #ffd84d;
            --white: #fff;
            --bg: #fffef5;
            --shadow-sm: 3px 3px 0 var(--black);
            --shadow-md: 4px 4px 0 var(--black);
            --shadow-lg: 6px 6px 0 var(--black);
            --border: 2.5px solid var(--black);
            --border-thick: 3px solid var(--black);
        }

        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            font-weight: 500;
            background: var(--bg);
            color: var(--black);
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: radial-gradient(circle, rgba(0,0,0,0.045) 1px, transparent 1px);
            background-size: 22px 22px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── HEADER ── */
        header {
            background: var(--green);
            border-bottom: var(--border-thick);
            padding: 0 50px;
            height: 66px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 0 var(--black);
        }

        header h1 {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 1.7rem;
            color: white;
            letter-spacing: 0.04em;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.25);
        }

        .homepage-link {
            text-decoration: none;
            color: inherit;
        }

        .menu-toggle {
            display: none;
            font-size: 24px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 8px;
        }

        nav ul li a {
            text-decoration: none;
            color: var(--black);
            font-family: 'Fredoka', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            background: var(--white);
            border: var(--border);
            border-radius: 50px;
            padding: 6px 18px;
            display: inline-block;
            box-shadow: var(--shadow-sm);
            transition: transform 0.12s, box-shadow 0.12s;
        }

        nav ul li a:hover {
            transform: translate(-2px,-2px);
            box-shadow: 5px 5px 0 var(--black);
        }

        @media (max-width: 768px) {
            header {
                padding: 0 16px;
                height: auto;
                min-height: 66px;
                flex-wrap: wrap;
                gap: 8px;
                padding: 8px 16px;
            }
            .menu-toggle {
                display: block;
            }
            nav {
                display: none;
                position: absolute;
                top: 66px;
                left: 0;
                right: 0;
                background: var(--green);
                border-bottom: var(--border);
                padding: 12px 0;
                flex-direction: column;
            }
            nav.show {
                display: flex;
            }
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 6px 0;
            }
        }

        /* ── HERO BANNER ── */
        .hero-section {
            background: var(--green-pale);
            border-bottom: var(--border-thick);
            padding: 40px 50px;
            text-align: center;
            position: relative;
            z-index: 1;
        }

        .hero-section h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--black);
            line-height: 1.2;
        }

        .hero-section p {
            font-size: 1.1rem;
            color: #666;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .hero-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--yellow);
            border: var(--border-thick);
            border-radius: 50px;
            padding: 10px 24px;
            font-weight: 700;
            font-size: 1.05rem;
            box-shadow: var(--shadow-sm);
            margin-bottom: 16px;
        }

        /* ── MAIN CONTENT ── */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 50px;
            position: relative;
            z-index: 1;
        }

        .player-container {
            background: var(--white);
            border: var(--border-thick);
            border-radius: 20px;
            padding: 0;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
            margin-bottom: 32px;
        }

        .video-player-wrap {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: var(--border-thick);
        }

        .video-player-wrap #yt-player {
            width: 100%;
            height: 100%;
        }

        .loading-text {
            text-align: center;
            color: #888;
            font-size: 1rem;
        }

        /* ── CONTROLS ── */
        .controls-section {
            padding: 20px;
            background: var(--green-pale);
            border-bottom: var(--border-thick);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .control-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .control-btn {
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            background: var(--yellow);
            color: var(--black);
            padding: 10px 20px;
            border: var(--border-thick);
            border-radius: 50px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            transition: transform 0.12s, box-shadow 0.12s;
            white-space: nowrap;
        }

        .control-btn:hover {
            transform: translate(-2px,-2px);
            box-shadow: 5px 5px 0 var(--black);
        }

        .control-btn.secondary {
            background: var(--white);
        }

        .time-display-box {
            padding: 10px 18px;
            background: var(--white);
            border: var(--border);
            border-radius: 12px;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--black);
            margin-left: auto;
            box-shadow: var(--shadow-sm);
        }

        /* ── SUBTITLE SELECTOR ── */
        .subtitle-section {
            padding: 20px;
            background: var(--white);
            border-bottom: var(--border-thick);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
        }

        .subtitle-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--black);
        }

        .subtitle-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .subtitle-option {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtitle-option input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
            accent-color: var(--green);
        }

        .subtitle-option label {
            cursor: pointer;
            font-weight: 500;
            font-size: 0.95rem;
            user-select: none;
        }

        /* ── TRANSCRIPT ── */
        .transcript-container {
            background: var(--white);
            border: var(--border-thick);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--shadow-lg);
        }

        .transcript-header {
            padding: 20px;
            background: var(--green);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            border-bottom: var(--border-thick);
        }

        .transcript-area {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
        }

        .sentence {
            margin-bottom: 16px;
            padding: 14px;
            background: var(--green-pale);
            border-radius: 12px;
            border-left: 4px solid var(--green);
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence:hover {
            background: #e8f7cc;
            border-left-color: var(--green-dark);
            transform: translateX(4px);
        }

        .sentence.active {
            background: var(--yellow);
            border-left-color: var(--green-dark);
            box-shadow: var(--shadow-sm);
        }

        .sentence-translation {
            font-size: 0.9rem;
            color: #555;
            margin-bottom: 10px;
            font-weight: 500;
            line-height: 1.4;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 10px;
        }

        .char {
            padding: 8px 12px;
            background: var(--white);
            border: 2px solid var(--green);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all 0.15s;
            font-weight: 600;
        }

        .char:hover {
            background: var(--green-light);
            transform: translateY(-2px);
        }

        .char .pinyin {
            font-size: 0.75rem;
            color: #888;
            line-height: 1;
        }

        .char .char-text {
            font-size: 1rem;
            font-weight: 700;
        }

        .char.active {
            background: var(--green);
            color: white;
            border-color: var(--green-dark);
            transform: scale(1.12) translateY(-3px);
            box-shadow: var(--shadow-md);
        }

        .char.active .pinyin {
            color: rgba(255,255,255,0.9);
        }

        .char.upcoming {
            opacity: 0.5;
            background: #f5f5f5;
        }

        .char.passed {
            opacity: 0.7;
            background: #e8e8e8;
        }

        .meta-info {
            font-size: 0.8rem;
            color: #999;
            margin-top: 8px;
            font-weight: 500;
        }

        .transcript-area::-webkit-scrollbar {
            width: 8px;
        }

        .transcript-area::-webkit-scrollbar-track {
            background: var(--green-pale);
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: var(--green);
            border-radius: 4px;
        }

        .transcript-area::-webkit-scrollbar-thumb:hover {
            background: var(--green-dark);
        }

        /* ── MODAL ── */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--white);
            border: var(--border-thick);
            border-radius: 20px;
            padding: 30px;
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.3s;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        @keyframes slideUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .character-detail {
            text-align: center;
        }

        .character-detail h2 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--black);
        }

        .character-detail-pinyin {
            font-size: 1.2rem;
            color: var(--green);
            font-style: italic;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .character-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            text-align: left;
        }

        .detail-column img {
            width: 100%;
            height: auto;
            border-radius: 12px;
            border: var(--border);
        }

        .info-item {
            background: var(--green-pale);
            padding: 12px;
            border-radius: 12px;
            border: var(--border);
        }

        .info-label {
            font-size: 0.8rem;
            color: #666;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .info-value {
            font-size: 0.95rem;
            color: var(--black);
            font-weight: 600;
            line-height: 1.5;
        }

        .character-audio {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .character-audio audio {
            flex: 1;
            height: 32px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            font-size: 1.8rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #999;
            transition: color 0.2s;
        }

        .modal-close:hover {
            color: var(--black);
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 768px) {
            header {
                padding: 0 16px;
            }

            header h1 {
                font-size: 1.4rem;
            }

            .hero-section {
                padding: 30px 20px;
            }

            .hero-section h1 {
                font-size: 1.8rem;
            }

            .hero-section p {
                font-size: 0.95rem;
            }

            main {
                padding: 30px 20px;
            }

            .controls-section {
                flex-direction: column;
                align-items: stretch;
            }

            .time-display-box {
                margin-left: 0;
            }

            .subtitle-section {
                flex-direction: column;
                align-items: flex-start;
            }

            .transcript-area {
                height: 300px;
            }

            .character-detail-body {
                grid-template-columns: 1fr;
            }

            .modal-content {
                padding: 24px;
                max-width: 90%;
            }

            .character-detail h2 {
                font-size: 2.5rem;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 8px 12px;
            }

            header h1 {
                font-size: 1.2rem;
            }

            .hero-section {
                padding: 20px 16px;
            }

            .hero-section h1 {
                font-size: 1.5rem;
            }

            main {
                padding: 20px 16px;
            }

            .control-btn {
                font-size: 0.85rem;
                padding: 8px 16px;
            }

            .controls-section {
                padding: 16px;
            }

            .subtitle-section {
                padding: 16px;
            }

            .subtitle-options {
                flex-direction: column;
                gap: 10px;
            }

            .transcript-area {
                height: 250px;
                padding: 14px;
            }

            .sentence {
                padding: 10px;
                margin-bottom: 12px;
            }

            .char {
                padding: 6px 10px;
                font-size: 0.9rem;
            }

            .character-detail h2 {
                font-size: 2rem;
            }

            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header>
        <h1><a href="index.html" class="homepage-link">CHINESE 60s</a></h1>
        <button class="menu-toggle">☰</button>
        <nav>
            <ul>
                <li><a href="about.html">About Us</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="courses.html">Courses</a></li>
            </ul>
        </nav>
    </header>

    <!-- Hero Section -->
    <section class="hero-section">
        <div class="hero-badge">🎬 Interactive Lesson</div>
        <h1>Learn Basic Chinese Conversations - Animated and Easy!</h1>
        <p>Boya 1 (Part 1) • Dialogue with Perfect Timing Sync</p>
    </section>

    <!-- Main Content -->
    <main>
        <!-- Video Player -->
        <div class="player-container">
            <div class="video-player-wrap" id="videoPlayer">
                <div class="loading-text">📺 Loading video...</div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <div class="control-group">
                    <button class="control-btn" onclick="togglePlayPause()" id="playBtn">▶️ Play</button>
                    <button class="control-btn secondary" onclick="stopVideo()">⏹️ Stop</button>
                    <button class="control-btn secondary" onclick="rewindVideo()">⏮️ Rewind 10s</button>
                    <button class="control-btn secondary" onclick="forwardVideo()">⏭️ Forward 10s</button>
                </div>
                <div class="time-display-box" id="timeDisplay">0:00 / 0:00</div>
            </div>

            <!-- Subtitle Selector -->
            <div class="subtitle-section">
                <span class="subtitle-label">📝 Subtitles:</span>
                <div class="subtitle-options">
                    <div class="subtitle-option">
                        <input type="radio" id="sub-none" name="subtitle" value="none" onchange="changeSubtitle('none')">
                        <label for="sub-none">None</label>
                    </div>
                    <div class="subtitle-option">
                        <input type="radio" id="sub-vietnamese" name="subtitle" value="vietnamese" onchange="changeSubtitle('vietnamese')">
                        <label for="sub-vietnamese">Vietnamese</label>
                    </div>
                    <div class="subtitle-option">
                        <input type="radio" id="sub-english" name="subtitle" value="english" onchange="changeSubtitle('english')">
                        <label for="sub-english">English</label>
                    </div>
                    <div class="subtitle-option">
                        <input type="radio" id="sub-both" name="subtitle" value="both" onchange="changeSubtitle('both')" checked>
                        <label for="sub-both">Both</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Transcript -->
        <div class="transcript-container">
            <div class="transcript-header">📚 Dialogue Transcript</div>
            <div class="transcript-area" id="transcriptArea">
                <div class="loading-text">⏳ Loading transcript...</div>
            </div>
        </div>
    </main>

    <!-- Character Detail Modal -->
    <div id="characterModal" class="modal">
        <div class="modal-content" onclick="event.stopPropagation();">
            <button class="modal-close" onclick="closeCharacterModal()">✕</button>
            <div class="character-detail" id="characterDetailContent"></div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let transcriptData = null;
        let sentencesData = null;
        let imagesData = null;
        let currentSentenceIndex = -1;
        let currentCharIndex = -1;
        let updateInterval = null;
        let subtitleMode = 'both';

        const transcriptArea = document.getElementById('transcriptArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');
        const videoPlayer = document.getElementById('videoPlayer');

        function extractYoutubeId(url) {
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];
            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) return match[1];
            }
            return '';
        }

        function loadYoutubeVideoAuto(url) {
            const videoId = extractYoutubeId(url);
            if (!videoId) return;

            videoPlayer.innerHTML = '<div id="yt-player"></div>';
            setTimeout(() => {
                player = new YT.Player('yt-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }, 100);
        }

        function onPlayerReady(event) {}

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                playBtn.textContent = '⏸️ Pause';
                startSync();
            } else if (event.data === YT.PlayerState.PAUSED) {
                playBtn.textContent = '▶️ Play';
                stopSync();
            } else if (event.data === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶️ Play';
                stopSync();
            }
        }

        function loadJsonFromPath(filePath) {
            fetch(filePath)
                .then(response => response.json())
                .then(data => {
                    transcriptData = data;
                    loadSentencesData();
                    loadImagesData();
                });
        }

        function loadSentencesData() {
            fetch('data/boya-sentences.json')
                .then(response => response.json())
                .then(data => { sentencesData = data; });
        }

        function loadImagesData() {
            fetch('data/imagesData.json')
                .then(response => response.json())
                .then(data => {
                    imagesData = data;
                    renderTranscript();
                })
                .catch(() => renderTranscript());
        }

        function getCharacterInfo(charText) {
            if (!imagesData) return null;
            return imagesData.find(img => img.character === charText);
        }

        function getSentenceTranslation(sentenceId) {
            if (!sentencesData) return { english: '', vietnamese: '' };
            const sentence = sentencesData.find(s => s.id === sentenceId);
            return sentence ? { english: sentence.english, vietnamese: sentence.vietnamese } : { english: '', vietnamese: '' };
        }

        function changeSubtitle(mode) {
            subtitleMode = mode;
            renderTranscript();
        }

        function renderTranscript() {
            if (!transcriptData || transcriptData.sentences.length === 0) {
                transcriptArea.innerHTML = '<div class="loading-text">No data</div>';
                return;
            }

            let html = '';
            transcriptData.sentences.forEach((sentence, idx) => {
                const translation = getSentenceTranslation(sentence.id);
                let translationHtml = '';

                if (subtitleMode === 'vietnamese' && translation.vietnamese) {
                    translationHtml = `<div class="sentence-translation">🇻🇳 ${translation.vietnamese}</div>`;
                } else if (subtitleMode === 'english' && translation.english) {
                    translationHtml = `<div class="sentence-translation">🇬🇧 ${translation.english}</div>`;
                } else if (subtitleMode === 'both') {
                    if (translation.vietnamese) translationHtml += `<div class="sentence-translation">🇻🇳 ${translation.vietnamese}</div>`;
                    if (translation.english) translationHtml += `<div class="sentence-translation">🇬🇧 ${translation.english}</div>`;
                }

                const charGroupsHtml = sentence.characters
                    .map((char, charIdx) => {
                        const charText = char.chars || char.char;
                        const pinyin = char.pinyin || '';
                        return `
                            <span class="char" data-sentence="${idx}" data-char="${charIdx}" onclick="showCharacterDetail('${charText}', event)">
                                <span class="pinyin">${pinyin}</span>
                                <span class="char-text">${charText}</span>
                            </span>
                        `;
                    })
                    .join('');

                html += `
                    <div class="sentence" data-index="${idx}" onclick="seekToSentence(${idx})">
                        ${translationHtml}
                        <div class="character-line">${charGroupsHtml}</div>
                        <div class="meta-info">${formatTime(sentence.startTime)} – ${formatTime(sentence.endTime)} (${sentence.duration.toFixed(1)}s)</div>
                    </div>
                `;
            });
            transcriptArea.innerHTML = html;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startSync() {
            if (updateInterval) clearInterval(updateInterval);
            updateInterval = setInterval(() => {
                if (!player || !transcriptData) return;
                try {
                    if (player.getPlayerState() !== YT.PlayerState.PLAYING) return;
                    const currentTime = player.getCurrentTime();
                    updateTranscriptHighlight(currentTime);
                    updateTimeDisplay(currentTime);
                } catch (e) {}
            }, 50);
        }

        function stopSync() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        function updateTranscriptHighlight(currentTime) {
            if (!transcriptData) return;

            let newSentenceIndex = -1;
            let newCharIndex = -1;

            for (let i = 0; i < transcriptData.sentences.length; i++) {
                const sentence = transcriptData.sentences[i];
                if (currentTime >= sentence.startTime && currentTime <= sentence.endTime) {
                    newSentenceIndex = i;
                    for (let j = 0; j < sentence.characters.length; j++) {
                        const char = sentence.characters[j];
                        if (currentTime >= char.startTime && currentTime <= char.startTime + char.duration) {
                            newCharIndex = j;
                            break;
                        }
                    }
                    break;
                }
            }

            if (newSentenceIndex !== currentSentenceIndex) {
                document.querySelectorAll('.sentence.active').forEach(el => el.classList.remove('active'));
                if (newSentenceIndex >= 0) {
                    const sentenceEl = document.querySelector(`[data-index="${newSentenceIndex}"]`);
                    if (sentenceEl) {
                        sentenceEl.classList.add('active');
                        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }
                currentSentenceIndex = newSentenceIndex;
            }

            document.querySelectorAll('.char').forEach(el => {
                const sentenceIdx = parseInt(el.dataset.sentence);
                const charIdx = parseInt(el.dataset.char);
                el.classList.remove('active', 'passed', 'upcoming');

                if (sentenceIdx === newSentenceIndex) {
                    if (charIdx === newCharIndex) el.classList.add('active');
                    else if (charIdx < newCharIndex) el.classList.add('passed');
                    else el.classList.add('upcoming');
                } else if (sentenceIdx < newSentenceIndex) {
                    el.classList.add('passed');
                }
            });

            currentCharIndex = newCharIndex;
        }

        function updateTimeDisplay(currentTime = null) {
            let time = currentTime || 0;
            if (!currentTime && player) {
                try { time = player.getCurrentTime(); } catch (e) { time = 0; }
            }
            let duration = transcriptData && transcriptData.sentences.length > 0
                ? transcriptData.sentences[transcriptData.sentences.length - 1].endTime
                : 0;
            timeDisplay.textContent = `${formatTime(time)} / ${formatTime(duration)}`;
        }

        function togglePlayPause() {
            if (!player) return;
            try {
                player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
            } catch (e) {}
        }

        function stopVideo() {
            if (!player) return;
            try {
                player.stopVideo();
                updateTranscriptHighlight(0);
                updateTimeDisplay(0);
                playBtn.textContent = '▶️ Play';
            } catch (e) {}
        }

        function rewindVideo() {
            if (!player) return;
            try {
                player.seekTo(Math.max(0, player.getCurrentTime() - 10));
            } catch (e) {}
        }

        function forwardVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                player.seekTo(Math.min(duration, current + 10));
            } catch (e) {}
        }

        function seekToSentence(index) {
            if (!transcriptData || !player) return;
            try {
                player.seekTo(transcriptData.sentences[index].startTime);
                player.playVideo();
            } catch (e) {}
        }

        function showCharacterDetail(charText, event) {
            event.stopPropagation();
            const charInfo = getCharacterInfo(charText);
            if (!charInfo) {
                alert('Character info not found');
                return;
            }

            let html = `
                <div class="character-detail">
                    <h2>${charInfo.character}</h2>
                    <div class="character-detail-pinyin">${charInfo.pinyin}</div>
                    <div class="character-detail-body">
                        <div class="detail-column">
                            ${charInfo.imageSrc ? `<img src="${charInfo.imageSrc}" alt="${charInfo.character}">` : ''}
                        </div>
                        <div class="detail-column">
                            <div class="info-item">
                                <div class="info-label">Meaning</div>
                                <div class="info-value">${charInfo.meaning || 'N/A'}</div>
                            </div>
                            ${charInfo.audioSrc ? `
                                <div class="character-audio">
                                    <span>🔊</span>
                                    <audio controls><source src="${charInfo.audioSrc}" type="audio/mpeg"></audio>
                                </div>
                            ` : ''}
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('characterDetailContent').innerHTML = html;
            document.getElementById('characterModal').classList.add('show');
        }

        function closeCharacterModal() {
            document.getElementById('characterModal').classList.remove('show');
        }

        document.addEventListener('click', (e) => {
            if (e.target.id === 'characterModal') closeCharacterModal();
        }, false);

        document.addEventListener('touchend', (e) => {
            if (e.target.id === 'characterModal') closeCharacterModal();
        }, false);

        window.addEventListener('load', () => {
            loadYoutubeVideoAuto('https://www.youtube.com/watch?v=yRhp-kQfD5g');
            loadJsonFromPath('data/boya-transcript.json');
            document.querySelector('.menu-toggle').addEventListener('click', () => {
                document.querySelector('nav').classList.toggle('show');
            });
        });
    </script>
</body>
</html>
