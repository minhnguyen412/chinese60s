<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Player - YouTube</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .mobile-layout {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
            margin-top: 20px;
        }

        .video-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            height: fit-content;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-controls {
            padding: 15px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
            background: #1a1a1a;
            border-top: 1px solid #333;
            width: 100%;
        }

        .button-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        button {
            padding: 8px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover {
            background: #555;
        }

        .time-display {
            padding: 8px 12px;
            background: #2a2a2a;
            border-radius: 6px;
            font-size: 11px;
            color: #888;
            text-align: center;
            font-family: 'Courier New', monospace;
            min-width: 100px;
            margin-left: auto;
        }

        .subtitle-selector {
            display: flex;
            gap: 8px;
            align-items: center;
            padding: 15px;
            background: none;
            border-top: 1px solid #333;
            flex-wrap: wrap;
            margin: 0;
        }

        .subtitle-selector label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        .subtitle-selector input[type="radio"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
        }

        /* Status */
        .status {
            display: none;
        }

        .info-box {
            background: #2a3a5a;
            border-left: 3px solid #667eea;
            padding: 10px;
            border-radius: 6px;
            color: #aaa;
        }

        .transcript-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            height: 550px;
        }

        .transcript-header {
            display: none;
        }

        .transcript-area {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .sentence {
            margin-bottom: 15px;
            padding: 10px;
            background: #252525;
            border-radius: 8px;
            border-left: 3px solid #555;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence:hover {
            background: #2a2a2a;
            border-left-color: #667eea;
        }

        .sentence.active {
            background: #2a3a5a;
            border-left-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .sentence-translation {
            font-size: 11px;
            color: #888;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .char {
            padding: 8px 10px;
            background: #333;
            border-radius: 4px;
            transition: all 0.1s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }

        .char .pinyin {
            font-size: 11px;
            color: #aaa;
            line-height: 1;
        }

        .char .char-text {
            font-size: 18px;
            font-weight: 600;
        }

        .char.active {
            background: #667eea;
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
            font-weight: 600;
        }

        .char.upcoming {
            background: #3a3a3a;
            opacity: 0.6;
        }

        .char.passed {
            background: #444;
            opacity: 0.8;
        }

        .meta-info {
            font-size: 10px;
            color: #666;
            margin-top: 6px;
        }

        .transcript-area::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-area::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .transcript-area::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        .loading {
            text-align: center;
            padding: 30px 15px;
            color: #aaa;
            font-size: 12px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            animation: fadeIn 0.3s;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.3s;
            max-height: 80vh;
            overflow-y: auto;
            pointer-events: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .character-detail {
            text-align: center;
        }

        .character-detail-header {
            margin-bottom: 15px;
        }

        .character-detail h2 {
            font-size: 36px;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .character-detail-pinyin {
            font-size: 16px;
            color: #667eea;
            font-style: italic;
        }

        .character-detail-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 15px;
        }

        .detail-column {
            text-align: left;
        }

        .character-detail-image {
            width: 100%;
            height: auto;
            max-height: 150px;
            border-radius: 8px;
            object-fit: cover;
        }

        .info-item {
            background: #2a2a2a;
            padding: 10px;
            border-radius: 6px;
        }

        .info-label {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-value {
            font-size: 13px;
            color: #fff;
            line-height: 1.4;
        }

        .character-audio {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }

        .character-audio .speaker-icon {
            font-size: 18px;
        }

        .character-audio audio {
            flex: 1;
            height: 28px;
            max-width: 100%;
        }

        /* Mobile Responsive */
        @media (max-width: 1024px) {
            .container {
                padding: 0;
            }

            .main-grid {
                grid-template-columns: 1fr;
                gap: 0;
                margin-bottom: 0;
                padding: 0;
            }

            .header {
                padding: 10px 15px;
                position: relative;
                z-index: 80;
            }

            .video-section {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                width: 100%;
                border: none;
                border-radius: 0;
                height: auto;
                aspect-ratio: 16 / 9;
                z-index: 100;
                margin: 0;
                padding: 0;
            }

            .video-player {
                aspect-ratio: 16 / 9;
                margin: 0;
                padding: 0;
            }

            .player-controls {
                display: none;
            }

            .transcript-section {
                position: fixed;
                top: calc(100vw * 9 / 16);
                left: 0;
                right: 0;
                width: 100%;
                height: auto;
                max-height: calc(100vh - 100vw * 9 / 16 - 100px);
                border: none;
                border-radius: 0;
                margin: 0;
                padding: 0;
                z-index: 90;
            }

            .subtitle-selector {
                position: fixed;
                bottom: 65px;
                left: 15px;
                right: 15px;
                width: auto;
                background: #2a2a2a;
                padding: 8px 12px;
                border-radius: 6px;
                z-index: 98;
                margin: 0;
                flex-wrap: wrap;
            }

            .player-controls:last-of-type {
                display: flex !important;
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                width: 100%;
                padding: 10px 15px;
                border-radius: 0;
                flex-direction: row;
                gap: 8px;
                z-index: 99;
                background: #1a1a1a;
                border: none;
                border-top: 1px solid #333;
                margin: 0;
            }

            .modal-content {
                max-width: 90%;
                padding: 16px;
                max-height: 70vh;
            }

            .character-detail h2 {
                font-size: 32px;
            }

            .character-detail-body {
                grid-template-columns: 1fr 1fr;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 0;
            }

            .container {
                padding: 0;
            }

            .header {
                padding: 10px 15px;
            }

            .header h1 {
                font-size: 22px;
            }

            .header p {
                font-size: 12px;
            }

            .main-grid {
                gap: 15px;
            }

            .video-player {
                aspect-ratio: 16 / 9;
            }

            .character-detail h2 {
                font-size: 28px;
            }

            .character-detail-pinyin {
                font-size: 14px;
            }

            button {
                padding: 7px 10px;
                font-size: 12px;
            }

            .char .char-text {
                font-size: 16px;
            }

            .sentence {
                padding: 8px;
                margin-bottom: 12px;
            }

            .sentence-translation {
                font-size: 10px;
            }

            .meta-info {
                font-size: 9px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Karaoke Player - YouTube</h1>
            <p>YouTube video + Perfect karaoke sync</p>
        </div>

        <div class="main-grid">
            <!-- Video Player Section -->
            <div class="video-section">
                <div class="video-player" id="videoPlayer">
                    <div class="loading">📺 Đang tải video YouTube...</div>
                </div>

                <!-- Controls (Desktop only) -->
                <div class="player-controls" id="desktopControls" style="display: none;">
                    <div class="button-group">
                        <button onclick="togglePlayPause()" id="playBtn">▶️</button>
                        <button onclick="stopVideo()" class="secondary">⏹️</button>
                        <button onclick="rewindVideo()" class="secondary">⏮️</button>
                        <button onclick="forwardVideo()" class="secondary">⏭️</button>
                    </div>
                    <div class="time-display">
                        <div id="timeDisplay">0:00 / 0:00</div>
                    </div>
                </div>

                <!-- Subtitle Selector (Desktop) -->
                <div class="subtitle-selector" id="desktopSubtitleSelector" style="display: none; position: static; background: none; padding: 15px; border-top: 1px solid #333; margin: 0;">
                    <span style="font-size: 12px; margin-right: 8px;">Phụ đề:</span>
                    <label>
                        <input type="radio" name="subtitle" value="none" onchange="changeSubtitle('none')">
                        <span>Không</span>
                    </label>
                    <label>
                        <input type="radio" name="subtitle" value="vietnamese" onchange="changeSubtitle('vietnamese')">
                        <span>Tiếng Việt</span>
                    </label>
                    <label>
                        <input type="radio" name="subtitle" value="english" onchange="changeSubtitle('english')">
                        <span>English</span>
                    </label>
                    <label>
                        <input type="radio" name="subtitle" value="both" onchange="changeSubtitle('both')" checked>
                        <span>Cả hai</span>
                    </label>
                </div>
            </div>

            <!-- Transcript Section -->
            <div class="transcript-section">
                <div class="transcript-area" id="transcriptArea">
                    <div class="loading">⏳ Đang tải transcript...</div>
                </div>
            </div>
        </div>

        <!-- Controls Bottom (Mobile) -->
        <div class="subtitle-selector">
            <span style="font-size: 12px; margin-right: 8px;">Phụ đề:</span>
            <label>
                <input type="radio" name="subtitle" value="none" onchange="changeSubtitle('none')">
                <span>Không</span>
            </label>
            <label>
                <input type="radio" name="subtitle" value="vietnamese" onchange="changeSubtitle('vietnamese')">
                <span>Tiếng Việt</span>
            </label>
            <label>
                <input type="radio" name="subtitle" value="english" onchange="changeSubtitle('english')">
                <span>English</span>
            </label>
            <label>
                <input type="radio" name="subtitle" value="both" onchange="changeSubtitle('both')" checked>
                <span>Cả hai</span>
            </label>
        </div>

        <div class="player-controls">
            <div class="button-group">
                <button onclick="togglePlayPause()" id="playBtn">▶️</button>
                <button onclick="stopVideo()" class="secondary">⏹️</button>
                <button onclick="rewindVideo()" class="secondary">⏮️</button>
                <button onclick="forwardVideo()" class="secondary">⏭️</button>
            </div>
            <div class="time-display">
                <div id="timeDisplay">0:00 / 0:00</div>
            </div>
        </div>
    </div>

    <!-- Character Detail Modal -->
    <div id="characterModal" class="modal">
        <div class="modal-content" onclick="event.stopPropagation();">
            <div class="character-detail" id="characterDetailContent">
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script>
        let player = null;
        let transcriptData = null;
        let sentencesData = null;
        let imagesData = null;
        let currentSentenceIndex = -1;
        let currentCharIndex = -1;
        let updateInterval = null;
        let videoStartTime = 0;
        let videoPausedTime = 0;
        let subtitleMode = 'both';

        const transcriptArea = document.getElementById('transcriptArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');
        const videoPlayer = document.getElementById('videoPlayer');

        function extractYoutubeId(url) {
            let videoId = '';
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];

            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    videoId = match[1];
                    break;
                }
            }

            return videoId;
        }

        function loadYoutubeVideoAuto(url) {
            const videoId = extractYoutubeId(url);

            if (!videoId) {
                return;
            }

            videoPlayer.innerHTML = `
                <div id="yt-player"></div>
            `;

            setTimeout(() => {
                player = new YT.Player('yt-player', {
                    height: '100%',
                    width: '100%',
                    videoId: videoId,
                    events: {
                        'onReady': onPlayerReady,
                        'onStateChange': onPlayerStateChange
                    }
                });
            }, 100);
        }

        function onPlayerReady(event) {
        }

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.PLAYING) {
                videoStartTime = player.getCurrentTime();
                playBtn.textContent = '⏸️';
                startSync();
            } else if (event.data === YT.PlayerState.PAUSED) {
                videoPausedTime = player.getCurrentTime();
                playBtn.textContent = '▶️';
                stopSync();
            } else if (event.data === YT.PlayerState.ENDED) {
                playBtn.textContent = '▶️';
                stopSync();
            }
        }

        function loadJsonFromPath(filePath) {
            fetch(filePath)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    transcriptData = data;
                    
                    if (!transcriptData.sentences || transcriptData.sentences.length === 0) {
                        return;
                    }
                    
                    const firstChar = transcriptData.sentences[0].characters?.[0];
                    if (!firstChar || (!firstChar.chars && !firstChar.char)) {
                        return;
                    }

                    loadSentencesData();
                    loadImagesData();
                })
                .catch(error => {
                });
        }

        function loadSentencesData() {
            fetch('data/boya-sentences.json')
                .then(response => response.json())
                .then(data => {
                    sentencesData = data;
                });
        }

        function loadImagesData() {
            fetch('data/imagesData.json')
                .then(response => response.json())
                .then(data => {
                    imagesData = data;
                    renderTranscript();
                })
                .catch(error => {
                    renderTranscript();
                });
        }

        function getCharacterInfo(charText) {
            if (!imagesData) return null;
            return imagesData.find(img => img.character === charText);
        }

        function getSentenceTranslation(sentenceId) {
            if (!sentencesData) return { english: '', vietnamese: '' };
            const sentence = sentencesData.find(s => s.id === sentenceId);
            return sentence ? { english: sentence.english, vietnamese: sentence.vietnamese } : { english: '', vietnamese: '' };
        }

        function changeSubtitle(mode) {
            subtitleMode = mode;
            renderTranscript();
        }

        function renderTranscript() {
            if (!transcriptData || transcriptData.sentences.length === 0) {
                transcriptArea.innerHTML = '<div class="loading">No data</div>';
                return;
            }

            let html = '';
            transcriptData.sentences.forEach((sentence, idx) => {
                const translation = getSentenceTranslation(sentence.id);
                
                let translationHtml = '';
                if (subtitleMode === 'vietnamese' && translation.vietnamese) {
                    translationHtml = `<div class="sentence-translation">🇻🇳 ${translation.vietnamese}</div>`;
                } else if (subtitleMode === 'english' && translation.english) {
                    translationHtml = `<div class="sentence-translation">🇬🇧 ${translation.english}</div>`;
                } else if (subtitleMode === 'both') {
                    if (translation.vietnamese) {
                        translationHtml = `<div class="sentence-translation">🇻🇳 ${translation.vietnamese}</div>`;
                    }
                    if (translation.english) {
                        translationHtml += `<div class="sentence-translation">🇬🇧 ${translation.english}</div>`;
                    }
                }

                const charGroupsHtml = sentence.characters
                    .map((char, charIdx) => {
                        const charText = char.chars || char.char;
                        const pinyin = char.pinyin || '';
                        
                        return `
                            <span class="char" data-sentence="${idx}" data-char="${charIdx}" onclick="showCharacterDetail('${charText}', event)">
                                <span class="pinyin">${pinyin}</span>
                                <span class="char-text">${charText}</span>
                            </span>
                        `;
                    })
                    .join('');

                html += `
                    <div class="sentence" data-index="${idx}" onclick="seekToSentence(${idx})">
                        ${translationHtml}
                        <div class="character-line">${charGroupsHtml}</div>
                        <div class="meta-info">
                            ${formatTime(sentence.startTime)} - ${formatTime(sentence.endTime)} 
                            (${sentence.duration.toFixed(1)}s)
                        </div>
                    </div>
                `;
            });
            transcriptArea.innerHTML = html;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startSync() {
            if (updateInterval) clearInterval(updateInterval);

            updateInterval = setInterval(() => {
                if (!player || !transcriptData) return;

                try {
                    const state = player.getPlayerState();
                    if (state !== YT.PlayerState.PLAYING) return;

                    const currentTime = player.getCurrentTime();
                    updateTranscriptHighlight(currentTime);
                    updateTimeDisplay(currentTime);
                } catch (e) {
                }
            }, 50);
        }

        function stopSync() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        function updateTranscriptHighlight(currentTime) {
            if (!transcriptData) return;

            let newSentenceIndex = -1;
            let newCharIndex = -1;

            for (let i = 0; i < transcriptData.sentences.length; i++) {
                const sentence = transcriptData.sentences[i];
                if (currentTime >= sentence.startTime && currentTime <= sentence.endTime) {
                    newSentenceIndex = i;

                    for (let j = 0; j < sentence.characters.length; j++) {
                        const char = sentence.characters[j];
                        const charEndTime = char.startTime + char.duration;
                        if (currentTime >= char.startTime && currentTime <= charEndTime) {
                            newCharIndex = j;
                            break;
                        }
                    }
                    break;
                }
            }

            if (newSentenceIndex !== currentSentenceIndex) {
                document.querySelectorAll('.sentence.active').forEach(el => {
                    el.classList.remove('active');
                });

                if (newSentenceIndex >= 0) {
                    const sentenceEl = document.querySelector(`[data-index="${newSentenceIndex}"]`);
                    if (sentenceEl) {
                        sentenceEl.classList.add('active');
                        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }

                currentSentenceIndex = newSentenceIndex;
            }

            document.querySelectorAll('.char').forEach(el => {
                const sentenceIdx = parseInt(el.dataset.sentence);
                const charIdx = parseInt(el.dataset.char);

                el.classList.remove('active', 'passed', 'upcoming');

                if (sentenceIdx === newSentenceIndex) {
                    if (charIdx === newCharIndex) {
                        el.classList.add('active');
                    } else if (charIdx < newCharIndex) {
                        el.classList.add('passed');
                    } else {
                        el.classList.add('upcoming');
                    }
                } else if (sentenceIdx < newSentenceIndex) {
                    el.classList.add('passed');
                }
            });

            currentCharIndex = newCharIndex;
        }

        function updateTimeDisplay(currentTime = null) {
            let time = currentTime || 0;
            if (!currentTime && player) {
                try {
                    time = player.getCurrentTime();
                } catch (e) {
                    time = 0;
                }
            }

            let duration = 0;
            if (transcriptData && transcriptData.sentences.length > 0) {
                const lastSentence = transcriptData.sentences[transcriptData.sentences.length - 1];
                duration = lastSentence.endTime;
            }
            timeDisplay.textContent = `${formatTime(time)} / ${formatTime(duration)}`;
        }

        function togglePlayPause() {
            if (!player) {
                return;
            }

            try {
                const state = player.getPlayerState();
                if (state === YT.PlayerState.PLAYING) {
                    player.pauseVideo();
                } else {
                    player.playVideo();
                }
            } catch (e) {
            }
        }

        function stopVideo() {
            if (!player) return;
            try {
                player.stopVideo();
                updateTranscriptHighlight(0);
                updateTimeDisplay(0);
                playBtn.textContent = '▶️';
            } catch (e) {
            }
        }

        function rewindVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                player.seekTo(Math.max(0, current - 10));
            } catch (e) {
            }
        }

        function forwardVideo() {
            if (!player) return;
            try {
                const current = player.getCurrentTime();
                const duration = player.getDuration();
                player.seekTo(Math.min(duration, current + 10));
            } catch (e) {
            }
        }

        function seekToSentence(index) {
            if (!transcriptData || !player) return;
            try {
                const sentence = transcriptData.sentences[index];
                player.seekTo(sentence.startTime);
                player.playVideo();
            } catch (e) {
            }
        }

        function showCharacterDetail(charText, event) {
            event.stopPropagation();
            const charInfo = getCharacterInfo(charText);
            if (!charInfo) {
                alert('Character info not found');
                return;
            }

            let html = `
                <div class="character-detail-header">
                    <h2>${charInfo.character}</h2>
                    <div class="character-detail-pinyin">${charInfo.pinyin}</div>
                </div>
                <div class="character-detail-body">
                    <div class="detail-column">
                        ${charInfo.imageSrc ? `<img src="${charInfo.imageSrc}" alt="${charInfo.character}" class="character-detail-image">` : ''}
                    </div>
                    <div class="detail-column">
                        <div class="info-item">
                            <div class="info-label">Meaning</div>
                            <div class="info-value">${charInfo.meaning || 'N/A'}</div>
                        </div>
                        ${charInfo.audioSrc ? `
                            <div class="character-audio">
                                <span class="speaker-icon">🔊</span>
                                <audio controls>
                                    <source src="${charInfo.audioSrc}" type="audio/mpeg">
                                </audio>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;

            document.getElementById('characterDetailContent').innerHTML = html;
            document.getElementById('characterModal').classList.add('show');
        }

        function closeCharacterModal() {
            document.getElementById('characterModal').classList.remove('show');
        }

        window.addEventListener('click', (event) => {
            const modal = document.getElementById('characterModal');
            if (event.target === modal) {
                closeCharacterModal();
            }
        });

        function setupLayoutForDevice() {
            const isMobile = window.innerWidth <= 1024;
            const desktopControls = document.getElementById('desktopControls');
            const desktopSubtitleSelector = document.getElementById('desktopSubtitleSelector');
            const mobileControls = document.querySelector('.player-controls:last-of-type');
            const mobileSubtitleSelector = document.querySelector('.subtitle-selector');

            if (isMobile) {
                if (desktopControls) desktopControls.style.display = 'none';
                if (desktopSubtitleSelector) desktopSubtitleSelector.style.display = 'none';
                if (mobileControls) mobileControls.style.display = 'flex';
                if (mobileSubtitleSelector) mobileSubtitleSelector.style.display = 'flex';
            } else {
                if (desktopControls) desktopControls.style.display = 'flex';
                if (desktopSubtitleSelector) desktopSubtitleSelector.style.display = 'block';
                if (mobileControls) mobileControls.style.display = 'none';
                if (mobileSubtitleSelector) mobileSubtitleSelector.style.display = 'none';
            }
        }

        window.addEventListener('load', () => {
            setupLayoutForDevice();
            loadYoutubeVideoAuto('https://www.youtube.com/watch?v=yRhp-kQfD5g');
            loadJsonFromPath('data/boya-transcript.json');
        });

        window.addEventListener('resize', setupLayoutForDevice);
    </script>
</body>
</html>
