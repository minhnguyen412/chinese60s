<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Player - Like StudyPhim</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
            font-size: 14px;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .video-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .youtube-frame {
            width: 100%;
            height: 400px;
            background: #000;
        }

        .player-controls {
            padding: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        .input-group {
            flex: 1;
            min-width: 250px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background: #2a2a2a;
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #333;
        }

        .button-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        button {
            padding: 10px 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover {
            background: #555;
        }

        .transcript-section {
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .transcript-header {
            padding: 15px;
            background: #2a2a2a;
            border-bottom: 1px solid #333;
            font-size: 14px;
            font-weight: 600;
        }

        .transcript-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .sentence {
            margin-bottom: 20px;
            padding: 12px;
            background: #252525;
            border-radius: 8px;
            border-left: 3px solid #555;
            cursor: pointer;
            transition: all 0.3s;
        }

        .sentence:hover {
            background: #2a2a2a;
            border-left-color: #667eea;
        }

        .sentence.active {
            background: #2a3a5a;
            border-left-color: #667eea;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .sentence-text {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .character-line {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        .char {
            padding: 6px 8px;
            background: #333;
            border-radius: 4px;
            font-size: 14px;
            transition: all 0.1s;
            cursor: default;
        }

        .char.active {
            background: #667eea;
            color: #fff;
            transform: scale(1.15);
            box-shadow: 0 0 8px rgba(102, 126, 234, 0.6);
            font-weight: 600;
        }

        .char.upcoming {
            background: #3a3a3a;
            opacity: 0.6;
        }

        .char.passed {
            background: #444;
            opacity: 0.8;
        }

        .meta-info {
            font-size: 12px;
            color: #888;
            margin-top: 6px;
        }

        /* Mobile responsive */
        @media (max-width: 1024px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .youtube-frame {
                height: 300px;
            }

            .transcript-section {
                height: 400px;
            }
        }

        /* Scrollbar styling */
        .transcript-area::-webkit-scrollbar {
            width: 6px;
        }

        .transcript-area::-webkit-scrollbar-track {
            background: #2a2a2a;
        }

        .transcript-area::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 3px;
        }

        .transcript-area::-webkit-scrollbar-thumb:hover {
            background: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #aaa;
        }

        .info-box {
            background: #2a3a5a;
            border-left: 3px solid #667eea;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .time-display {
            padding: 10px;
            background: #2a2a2a;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 Karaoke Player</h1>
            <p>Play YouTube video + Karaoke transcript sync (like StudyPhim)</p>
        </div>

        <div class="main-grid">
            <!-- Video Player Section -->
            <div class="video-section">
                <div id="youtube-container" class="youtube-frame">
                    <div class="loading">📺 YouTube video will appear here</div>
                </div>

                <div class="player-controls">
                    <div class="input-group" style="flex: 1; min-width: 300px;">
                        <label>YouTube Link</label>
                        <input 
                            type="text" 
                            id="youtubeUrl" 
                            placeholder="https://www.youtube.com/watch?v=..."
                            value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
                        >
                    </div>
                    <div class="button-group">
                        <button onclick="loadYoutubeVideo()">Load Video</button>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="input-group" style="flex: 1; min-width: 300px;">
                        <label>JSON Transcript File</label>
                        <input type="file" id="jsonFile" accept=".json" onchange="loadJsonFile(event)">
                    </div>
                    <div class="button-group">
                        <button onclick="document.getElementById('jsonFile').click()" class="secondary">Browse</button>
                    </div>
                </div>

                <div class="player-controls">
                    <div class="button-group">
                        <button onclick="playPause()" id="playBtn">▶️ Play</button>
                        <button onclick="stopVideo()" class="secondary">⏹️ Stop</button>
                        <button onclick="rewindVideo()" class="secondary">⏮️ -10s</button>
                        <button onclick="forwardVideo()" class="secondary">⏭️ +10s</button>
                    </div>
                    <div class="time-display">
                        <div id="timeDisplay">0:00 / 0:00</div>
                    </div>
                </div>

                <div style="padding: 15px; background: #1a1a1a; border-top: 1px solid #333;">
                    <div class="info-box" id="statusBox">
                        ℹ️ Paste YouTube link → Load Video → Upload JSON → Play
                    </div>
                </div>
            </div>

            <!-- Transcript Section -->
            <div class="transcript-section">
                <div class="transcript-header">
                    📝 Karaoke Transcript
                </div>
                <div class="transcript-area" id="transcriptArea">
                    <div class="loading">Upload JSON file to see transcript...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let player;
        let transcriptData = null;
        let currentSentenceIndex = -1;
        let currentCharIndex = -1;
        let isPlaying = false;
        let updateInterval = null;
        let currentVideoTime = 0;

        const statusBox = document.getElementById('statusBox');
        const transcriptArea = document.getElementById('transcriptArea');
        const timeDisplay = document.getElementById('timeDisplay');
        const playBtn = document.getElementById('playBtn');

        function extractYoutubeId(url) {
            let videoId = '';
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /^([a-zA-Z0-9_-]{11})$/
            ];

            for (let pattern of patterns) {
                const match = url.match(pattern);
                if (match) {
                    videoId = match[1];
                    break;
                }
            }

            return videoId;
        }

        function loadYoutubeVideo() {
            const url = document.getElementById('youtubeUrl').value;
            const videoId = extractYoutubeId(url);

            if (!videoId) {
                statusBox.innerHTML = '❌ Invalid YouTube link. Try: https://www.youtube.com/watch?v=...';
                return;
            }

            const container = document.getElementById('youtube-container');
            
            // Use simple embed without JS API for better compatibility
            container.innerHTML = `
                <iframe 
                    id="youtube-iframe"
                    width="100%" 
                    height="100%" 
                    src="https://www.youtube.com/embed/${videoId}?modestbranding=1&rel=0" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen
                    style="border-radius: 8px;">
                </iframe>
            `;

            statusBox.innerHTML = '✅ Video loaded! Now upload JSON transcript.';
            player = createSimplePlayer();
        }

        // Create a simple player that tracks time without YouTube API
        function createSimplePlayer() {
            return {
                iframe: null,
                isPlaying: false,
                startTime: null,
                pauseTime: 0,
                
                init() {
                    this.iframe = document.getElementById('youtube-iframe');
                    return this;
                },

                play() {
                    this.isPlaying = true;
                    this.startTime = Date.now() / 1000 - this.pauseTime;
                    playBtn.textContent = '⏸️ Pause';
                    startSync();
                },

                pause() {
                    this.isPlaying = false;
                    this.pauseTime = (Date.now() / 1000) - this.startTime;
                    playBtn.textContent = '▶️ Play';
                    stopSync();
                },

                stop() {
                    this.isPlaying = false;
                    this.pauseTime = 0;
                    this.startTime = null;
                    playBtn.textContent = '▶️ Play';
                    stopSync();
                    updateTranscriptHighlight(0);
                },

                getCurrentTime() {
                    if (this.isPlaying && this.startTime) {
                        return (Date.now() / 1000) - this.startTime;
                    }
                    return this.pauseTime;
                },

                getDuration() {
                    return 600; // Placeholder
                },

                seekTo(seconds) {
                    this.pauseTime = seconds;
                    if (this.isPlaying) {
                        this.startTime = Date.now() / 1000 - seconds;
                    }
                    updateTranscriptHighlight(seconds);
                },

                playVideo() {
                    this.play();
                },

                pauseVideo() {
                    this.pause();
                },

                stopVideo() {
                    this.stop();
                }
            }.init();
        }

        function onPlayerReady() {
            statusBox.innerHTML = '✅ Player ready! Press Play to start.';
        }

        function onPlayerStateChange() {
            // Handle state changes
        }

        function loadJsonFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    transcriptData = JSON.parse(e.target.result);
                    renderTranscript();
                    statusBox.innerHTML = `✅ Loaded ${transcriptData.sentences.length} sentences!`;
                } catch (error) {
                    statusBox.innerHTML = '❌ Invalid JSON file: ' + error.message;
                }
            };
            reader.readAsText(file);
        }

        function renderTranscript() {
            if (!transcriptData || transcriptData.sentences.length === 0) {
                transcriptArea.innerHTML = '<div class="loading">No data</div>';
                return;
            }

            let html = '';
            transcriptData.sentences.forEach((sentence, idx) => {
                html += `
                    <div class="sentence" data-index="${idx}" onclick="seekToSentence(${idx})">
                        <div class="sentence-text">${sentence.text}</div>
                        <div class="character-line">
                            ${sentence.characters.map((charGroup, charIdx) => `
                                <span class="char" data-sentence="${idx}" data-char="${charIdx}">
                                    ${charGroup.chars}
                                </span>
                            `).join('')}
                        </div>
                        <div class="meta-info">
                            ${formatTime(sentence.startTime)} - ${formatTime(sentence.endTime)} 
                            (${sentence.duration.toFixed(1)}s)
                        </div>
                    </div>
                `;
            });
            transcriptArea.innerHTML = html;
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = (seconds % 60).toFixed(0).padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function startSync() {
            if (updateInterval) clearInterval(updateInterval);

            updateInterval = setInterval(() => {
                if (!player || !player.isPlaying || !transcriptData) return;

                try {
                    const currentTime = player.getCurrentTime();
                    updateTranscriptHighlight(currentTime);
                    updateTimeDisplay(currentTime);
                } catch (e) {
                    console.error('Sync error:', e);
                }
            }, 50); // Update every 50ms for smooth karaoke effect
        }

        function stopSync() {
            if (updateInterval) {
                clearInterval(updateInterval);
                updateInterval = null;
            }
        }

        function updateTranscriptHighlight(currentTime) {
            if (!transcriptData) return;

            let newSentenceIndex = -1;
            let newCharIndex = -1;

            // Find current sentence
            for (let i = 0; i < transcriptData.sentences.length; i++) {
                const sentence = transcriptData.sentences[i];
                if (currentTime >= sentence.startTime && currentTime <= sentence.endTime) {
                    newSentenceIndex = i;

                    // Find current character in sentence
                    for (let j = 0; j < sentence.characters.length; j++) {
                        const char = sentence.characters[j];
                        const charEndTime = char.startTime + char.duration;
                        if (currentTime >= char.startTime && currentTime <= charEndTime) {
                            newCharIndex = j;
                            break;
                        }
                    }
                    break;
                }
            }

            // Update UI if changed
            if (newSentenceIndex !== currentSentenceIndex) {
                // Remove old highlight
                document.querySelectorAll('.sentence.active').forEach(el => {
                    el.classList.remove('active');
                });

                // Add new highlight
                if (newSentenceIndex >= 0) {
                    const sentenceEl = document.querySelector(`[data-index="${newSentenceIndex}"]`);
                    if (sentenceEl) {
                        sentenceEl.classList.add('active');
                        // Auto scroll to active sentence
                        sentenceEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }

                currentSentenceIndex = newSentenceIndex;
            }

            // Update character highlighting
            document.querySelectorAll('.char').forEach(el => {
                const sentenceIdx = parseInt(el.dataset.sentence);
                const charIdx = parseInt(el.dataset.char);

                el.classList.remove('active', 'passed', 'upcoming');

                if (sentenceIdx === newSentenceIndex) {
                    if (charIdx === newCharIndex) {
                        el.classList.add('active');
                    } else if (charIdx < newCharIndex) {
                        el.classList.add('passed');
                    } else {
                        el.classList.add('upcoming');
                    }
                } else if (sentenceIdx < newSentenceIndex) {
                    el.classList.add('passed');
                }
            });

            currentCharIndex = newCharIndex;
        }

        function updateTimeDisplay(currentTime) {
            let duration = 0;
            if (transcriptData && transcriptData.sentences.length > 0) {
                const lastSentence = transcriptData.sentences[transcriptData.sentences.length - 1];
                duration = lastSentence.endTime;
            }
            timeDisplay.textContent = `${formatTime(currentTime)} / ${formatTime(duration)}`;
        }

        function playPause() {
            if (!player) {
                statusBox.innerHTML = '❌ Load video first!';
                return;
            }

            if (player.isPlaying) {
                player.pauseVideo();
                isPlaying = false;
            } else {
                player.playVideo();
                isPlaying = true;
            }
        }

        function stopVideo() {
            if (!player) return;
            player.stopVideo();
            isPlaying = false;
        }

        function rewindVideo() {
            if (!player) return;
            const current = player.getCurrentTime();
            player.seekTo(Math.max(0, current - 10));
            updateTimeDisplay(Math.max(0, current - 10));
        }

        function forwardVideo() {
            if (!player) return;
            const current = player.getCurrentTime();
            let maxTime = 600;
            if (transcriptData && transcriptData.sentences.length > 0) {
                maxTime = transcriptData.sentences[transcriptData.sentences.length - 1].endTime;
            }
            player.seekTo(Math.min(maxTime, current + 10));
            updateTimeDisplay(Math.min(maxTime, current + 10));
        }

        function seekToSentence(index) {
            if (!transcriptData || !player) return;
            const sentence = transcriptData.sentences[index];
            player.seekTo(sentence.startTime);
            player.playVideo();
        }

        // Initialize on load
        window.addEventListener('load', () => {
            statusBox.innerHTML = '✅ Ready! Paste YouTube link & upload JSON file.';
        });
    </script>
</body>
</html>
